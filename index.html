<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Сегодня — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <meta name="theme-color" content="#6F7B52">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app home-app">
    <header class="header">
      <button class="icon-btn" onclick="openCalendar()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3.5v3M16 3.5v3M3.5 9.5h17"/></svg></button>
      <div class="titles"><h1><span id="dayTitle">Сегодня</span></h1></div>
      <button class="icon-btn" id="loginBtn" onclick="doLogin()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c1.2-3.2 3.5-4.8 6.5-4.8S17.8 15.8 19 19"/></svg></button>
    </header>
    <section class="summary">
      <div class="side-stat"><div class="icon-3d"></div><div class="label">Съедено</div><div class="value" id="eaten">0</div></div>
      <div class="ring"><div class="ring-inner"><div class="big" id="remaining">1700</div><div class="small">осталось</div></div></div>
      <div class="side-stat"><div class="icon-3d"></div><div class="label">Шаги</div><div class="value" id="stepsValue">—</div></div>
    </section>
    <div class="day-switch">
      <button class="arrow" onclick="changeDay(-1)">←</button>
      <div class="date" id="day-date">18 ноября</div>
      <button class="arrow" onclick="changeDay(1)">→</button>
    </div>
    <div class="card">
      <div class="macro"><div class="macro-ic"></div><div class="macro-info"><div class="macro-name">Белки</div><div class="bar"><div class="bar-fill" id="barP" style="width:0%"></div></div></div><div class="macro-nums" id="macroP">0 / 90 г</div></div>
      <div class="macro"><div class="macro-ic"></div><div class="macro-info"><div class="macro-name">Жиры</div><div class="bar"><div class="bar-fill" id="barF" style="width:0%"></div></div></div><div class="macro-nums" id="macroF">0 / 70 г</div></div>
      <div class="macro"><div class="macro-ic"></div><div class="macro-info"><div class="macro-name">Углеводы</div><div class="bar"><div class="bar-fill" id="barC" style="width:0%"></div></div></div><div class="macro-nums" id="macroC">0 / 200 г</div></div>
    </div>
    <div class="meal-head"><h2>Приёмы пищи</h2><button class="day-btn" onclick="showDay()">Весь день</button></div>
    <div id="mealsContainer"></div>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active"><span class="nav-ic"></span>Сегодня</a>
      <a href="products.html" class="nav-item"><span class="nav-ic"></span>Продукты</a>
      <a href="weight.html" class="nav-item"><span class="nav-ic"></span>Вес</a>
      <a href="menu.html" class="nav-item"><span class="nav-ic"></span>Меню</a>
      <a href="workouts.html" class="nav-item"><span class="nav-ic"></span>Тренировки</a>
    </nav>
  </div>
  <div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; align-items:center; justify-content:center;">
    <div style="background:#F3EDE0; border-radius:20px; padding:24px; text-align:center;">
      <div style="font-weight:700; margin-bottom:12px;">Войти через Google</div>
      <div id="gbtn"></div>
      <button onclick="document.getElementById('loginModal').style.display='none'" style="margin-top:12px; padding:8px 16px; border:none; border-radius:12px; background:#6F7B52; color:white;">Закрыть</button>
    </div>
  </div>
  <script>
    let dayOffset = 0, currentDiary = {};
    const meals = ['Завтрак', 'Обед', 'Ужин', 'Перекус'];
    const goal = 1700;
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    function doLogin() {
      document.getElementById('loginModal').style.display = 'flex';
      if (window.google && google.accounts) {
        google.accounts.id.initialize({
          client_id: CalAPI.CLIENT_ID,
          callback: (resp) => { CalAPI.setToken(resp.credential); document.getElementById('loginModal').style.display = 'none'; loadDiary(); }
        });
        google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large' });
      }
    }

    function dateStr() {
      const d = new Date(); d.setDate(d.getDate() + dayOffset);
      return d.toISOString().slice(0, 10);
    }

    async function loadDiary() {
      if (!CalAPI.getToken()) { document.getElementById('mealsContainer').innerHTML = '<div style="text-align:center; padding:40px; color:#888;">Войди, чтобы увидеть дневник</div>'; return; }
      try {
        currentDiary = await CalAPI.diary.get(dateStr()) || {};
      } catch (e) { currentDiary = {}; }
      render();
    }

    function render() {
      let totalK = 0, totalP = 0, totalF = 0, totalC = 0;
      const container = document.getElementById('mealsContainer');
      container.innerHTML = '';
      meals.forEach(meal => {
        const items = currentDiary[meal] || [];
        let mealK = 0, mealP = 0, mealF = 0, mealC = 0;
        items.forEach(i => { mealK += i.calories || 0; mealP += i.protein || 0; mealF += i.fat || 0; mealC += i.carbs || 0; totalK += i.calories || 0; totalP += i.protein || 0; totalF += i.fat || 0; totalC += i.carbs || 0; });
        container.innerHTML += `<div class="meal" onclick="showMeal('${meal}')">
          <div class="meal-info"><div class="meal-name">${meal}</div><div class="meal-kcal">${mealK} ккал</div></div>
        </div>`;
      });
      document.getElementById('eaten').textContent = totalK;
      document.getElementById('remaining').textContent = Math.max(0, goal - totalK);
      document.getElementById('macroP').textContent = Math.round(totalP) + ' / 90 г';
      document.getElementById('macroF').textContent = Math.round(totalF) + ' / 70 г';
      document.getElementById('macroC').textContent = Math.round(totalC) + ' / 200 г';
      document.getElementById('barP').style.width = Math.min(100, totalP / 90 * 100) + '%';
      document.getElementById('barF').style.width = Math.min(100, totalF / 70 * 100) + '%';
      document.getElementById('barC').style.width = Math.min(100, totalC / 200 * 100) + '%';
      const d = new Date(); d.setDate(d.getDate() + dayOffset);
      document.getElementById('day-date').textContent = d.getDate() + ' ' + months[d.getMonth()];
    }

    function changeDay(d) { dayOffset += d; loadDiary(); }
    function showMeal(meal) {
      const items = currentDiary[meal] || [];
      alert(meal + '\n' + (items.length ? items.map(i => i.name + ' ' + i.grams + 'г = ' + i.calories + ' ккал').join('\n') : 'пусто'));
    }
    function showDay() { alert(JSON.stringify(currentDiary, null, 2)); }
    function openCalendar() {}

    loadDiary();
  </script>
</body>
</html>
