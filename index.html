<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сегодня — Калории</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7d9b7a">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    .calendar-overlay, .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; align-items: center;
    }
    .calendar-overlay.show, .modal-overlay.show { display: flex; }
    .calendar-modal, .modal-box {
      background: var(--cream); border-radius: 20px; width: 90%; max-width: 360px;
      padding: 20px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); max-height: 85vh; overflow-y: auto;
    }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-title { font-size: 18px; font-weight: 700; color: var(--sage-dark); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-weekday { font-size: 12px; color: var(--text-light); padding: 6px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
      background: transparent; position: relative;
    }
    .cal-day.today { background: var(--sage); color: white; font-weight: 700; }
    .cal-day.selected { outline: 2px solid var(--sage); }
    .cal-day.other { color: #ccc; }
    .cal-day:hover { background: var(--sage-light); }
    .cal-icons { font-size: 9px; line-height: 1; margin-top: 1px; }
    .meal-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; }
    .day-btn {
      padding: 6px 12px; border-radius: 12px; border: none;
      background: var(--sage-light); color: var(--sage-dark); font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .food-entry { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--sage-light); font-size: 14px; }
    .ring {
      width: 140px; height: 140px; border-radius: 50%;
      background: conic-gradient(var(--sage) 0deg, var(--sage-light) 0deg);
      display: flex; align-items: center; justify-content: center;
    }
    .ring-inner {
      width: 110px; height: 110px; border-radius: 50%; background: var(--cream);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .day-stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--sage-light); font-size: 14px; }
    .day-info { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--sage-light); }
    .workout-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--sage-light); font-size: 13px; }
    .kg-badge { background: var(--sage); color: white; padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 600; }
    .load-sq { width: 10px; height: 10px; border-radius: 2px; }
    .load-easy { background: #a8d5a2; }
    .load-mid { background: #f5d76e; }
    .load-hard { background: #e8a0a0; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div style="display:flex; align-items:center; gap:6px;">
        <button class="icon-btn" onclick="changeDay(-1)">←</button>
        <button class="icon-btn" onclick="openCalendar()">📅</button>
        <button class="icon-btn" onclick="changeDay(1)">→</button>
      </div>
      <div style="text-align:center;">
        <h1 id="dayTitle">Сегодня</h1>
        <div id="day-date" style="font-size:13px; color:var(--text-light); margin-top:2px;">16 ноября</div>
      </div>
      <a href="profile.html"><button class="icon-btn">👤</button></a>
    </header>

    <section class="summary">
      <div class="side-stat">
        <div class="icon-circle">🥣</div>
        <div class="label">Съедено</div>
        <div class="value" id="eaten">0</div>
      </div>
      <div class="ring" id="calorieRing">
        <div class="ring-inner">
          <div class="big" id="remaining">1700</div>
          <div class="small">осталось</div>
        </div>
      </div>
      <div class="side-stat">
        <div class="icon-circle">👟</div>
        <div class="label">Шаги</div>
        <div class="value" id="stepsValue">—</div>
      </div>
    </section>

    <div class="card">
      <div class="macro">
        <div class="macro-icon">💧</div>
        <div class="macro-info">
          <div class="macro-name">Белки</div>
          <div class="bar"><div class="bar-fill" id="barP" style="width:0%"></div></div>
        </div>
        <div class="macro-nums" id="macroP">0 / 90 г</div>
      </div>
      <div class="macro">
        <div class="macro-icon">🟡</div>
        <div class="macro-info">
          <div class="macro-name">Жиры</div>
          <div class="bar"><div class="bar-fill" id="barF" style="width:0%"></div></div>
        </div>
        <div class="macro-nums" id="macroF">0 / 70 г</div>
      </div>
      <div class="macro">
        <div class="macro-icon">🌾</div>
        <div class="macro-info">
          <div class="macro-name">Углеводы</div>
          <div class="bar"><div class="bar-fill" id="barC" style="width:0%"></div></div>
        </div>
        <div class="macro-nums" id="macroC">0 / 200 г</div>
      </div>
    </div>

    <div class="meal-header">
      <h2 style="font-size:18px; color:var(--sage-dark); margin:0;">Приёмы пищи</h2>
      <button class="day-btn" onclick="showDay()">Весь день</button>
    </div>
    <div id="mealsContainer"></div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active">🏠<span>Сегодня</span></a>
      <a href="products.html" class="nav-item">🥦<span>Продукты</span></a>
      <a href="weight.html" class="nav-item">⚖️<span>Вес</span></a>
      <a href="menu.html" class="nav-item">📋<span>Меню</span></a>
      <a href="workouts.html" class="nav-item">💪<span>Тренировки</span></a>
    </nav>
  </div>

  <div class="calendar-overlay" id="calOverlay" onclick="if(event.target===this) closeCalendar()">
    <div class="calendar-modal">
      <div class="cal-header">
        <button class="icon-btn" onclick="changeMonth(-1)">←</button>
        <div class="cal-title" id="calMonthTitle">Ноябрь 2026</div>
        <button class="icon-btn" onclick="changeMonth(1)">→</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-info" id="dayInfo" style="display:none;"></div>
      <button onclick="goToDay()" id="goToDayBtn" style="display:none; margin-top:12px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage-light); color:var(--sage-dark); font-family:inherit; font-size:15px; font-weight:600;">Перейти к дню</button>
      <button onclick="closeCalendar()" style="margin-top:12px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage); color:white; font-family:inherit; font-size:15px; font-weight:600;">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="mealModal" onclick="if(event.target===this) closeMealModal()">
    <div class="modal-box">
      <div style="font-weight:700; font-size:18px; margin-bottom:12px;" id="mealModalTitle">Завтрак</div>
      <div id="mealModalContent"></div>
      <button onclick="closeMealModal()" style="margin-top:16px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage); color:white; font-family:inherit; font-size:15px; font-weight:600;">Закрыть</button>
    </div>
  </div>

  <script>
    let dayOffset = 0;
    let calMonth = new Date().getMonth();
    let calYear = new Date().getFullYear();
    let currentDiary = {};
    let selectedCalDay = null;
    const goal = 1700;
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const monthsNom = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    const meals = ['Завтрак', 'Обед', 'Ужин', 'Перекус'];
    const mealIcons = {'Завтрак': '🥣', 'Обед': '🍽️', 'Ужин': '🥗', 'Перекус': '🍎'};
    const typeIcons = { pool: '💧', family: '💜', warmup: '💚', own: '🌿' };
    const loadClasses = ['','load-easy','load-mid','load-hard'];

    function changeDay(delta) {
      dayOffset += delta;
      updateDate();
      loadDiary();
    }
    function updateDate() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);
      document.getElementById('day-date').textContent = date.getDate() + ' ' + months[date.getMonth()];

      let title = 'Сегодня';
      if (dayOffset === -1) title = 'Вчера';
      else if (dayOffset === 1) title = 'Завтра';
      else if (dayOffset !== 0) title = date.getDate() + ' ' + months[date.getMonth()];
      document.getElementById('dayTitle').textContent = title;
    }

    function openCalendar() {
      selectedCalDay = null;
      document.getElementById('dayInfo').style.display = 'none';
      document.getElementById('goToDayBtn').style.display = 'none';
      renderCalendar();
      document.getElementById('calOverlay').classList.add('show');
    }
    function closeCalendar() {
      document.getElementById('calOverlay').classList.remove('show');
    }
    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      if (calMonth < 0) { calMonth = 11; calYear--; }
      selectedCalDay = null;
      document.getElementById('dayInfo').style.display = 'none';
      document.getElementById('goToDayBtn').style.display = 'none';
      renderCalendar();
    }
    function renderCalendar() {
      document.getElementById('calMonthTitle').textContent = monthsNom[calMonth] + ' ' + calYear;
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      weekdays.forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = d;
        grid.appendChild(el);
      });
      const first = new Date(calYear, calMonth, 1);
      let start = first.getDay() - 1;
      if (start < 0) start = 6;
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const today = new Date();
      for (let i = 0; i < start; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day other';
        grid.appendChild(el);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const el = document.createElement('div');
        el.className = 'cal-day';
        if (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear()) {
          el.classList.add('today');
        }
        if (d === selectedCalDay) el.classList.add('selected');
        const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const wKey = 'workouts-' + dateStr;
        const wData = JSON.parse(localStorage.getItem(wKey) || '[]');
        let icons = '';
        if (wData.length) {
          const types = [...new Set(wData.map(w => w.type))];
          icons = types.map(t => typeIcons[t] || '').join('');
        }
        el.innerHTML = d + (icons ? `<div class="cal-icons">${icons}</div>` : '');
        el.onclick = () => showDayInfo(d);
        grid.appendChild(el);
      }
    }

    function formatWorkout(w) {
      let html = `<div class="workout-row">`;
      html += `<span>${w.icon || ''}</span>`;
      html += `<div style="flex:1;"><div>${w.name}</div>`;
      if (w.week || w.kg || w.load) {
        html += `<div style="display:flex; align-items:center; gap:6px; margin-top:2px; font-size:11px; color:var(--text-light);">`;
        if (w.week) html += `<span>Нед.${w.week} трен.${w.day}</span>`;
        if (w.kg) html += `<span class="kg-badge">${w.kg}</span>`;
        if (w.load) {
          const lc = w.loadIdx ? loadClasses[w.loadIdx] : '';
          html += `<span style="display:flex; align-items:center; gap:3px;"><span class="load-sq ${lc}"></span>${w.load}</span>`;
        }
        html += `</div>`;
      }
      html += `</div></div>`;
      return html;
    }

    function showDayInfo(day) {
      selectedCalDay = day;
      renderCalendar();
      const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');

      const diary = JSON.parse(localStorage.getItem('diary-' + dateStr) || '{}');
      let totalK = 0;
      Object.values(diary).forEach(items => {
        if (Array.isArray(items)) items.forEach(i => totalK += i.calories || 0);
      });

      const steps = localStorage.getItem('steps-' + dateStr) || '—';
      const weightHistory = JSON.parse(localStorage.getItem('weightHistory') || '[]');
      const dayWeight = weightHistory.find(w => w.date === dateStr);
      const weight = dayWeight ? dayWeight.weight + ' кг' : '—';

      const wData = JSON.parse(localStorage.getItem('workouts-' + dateStr) || '[]');

      let html = `<div style="font-weight:700; text-align:center; margin-bottom:8px;">${day} ${months[calMonth]}</div>`;
      html += `<div class="day-stat"><span>Калории</span><b>${totalK} ккал</b></div>`;
      html += `<div class="day-stat"><span>Шаги</span><b>${steps}</b></div>`;
      html += `<div class="day-stat"><span>Вес</span><b>${weight}</b></div>`;

      if (wData.length) {
        html += `<div style="font-weight:600; margin-top:10px;">Тренировки</div>`;
        wData.forEach(w => { html += formatWorkout(w); });
      } else {
        html += `<div style="color:var(--text-light); margin-top:10px; text-align:center; font-size:13px;">Тренировок нет</div>`;
      }

      document.getElementById('dayInfo').innerHTML = html;
      document.getElementById('dayInfo').style.display = 'block';
      document.getElementById('goToDayBtn').style.display = 'block';
    }

    function goToDay() {
      if (selectedCalDay) {
        const selected = new Date(calYear, calMonth, selectedCalDay);
        const today = new Date();
        today.setHours(0,0,0,0);
        dayOffset = Math.round((selected - today) / 86400000);
        updateDate();
        loadDiary();
      }
      closeCalendar();
    }

    function loadDiary() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);
      const dateStr = date.toISOString().slice(0,10);
      const key = 'diary-' + dateStr;
      currentDiary = JSON.parse(localStorage.getItem(key) || '{}');

      const stepsKey = 'steps-' + dateStr;
      const steps = localStorage.getItem(stepsKey);
      document.getElementById('stepsValue').textContent = steps || '—';

      let totalK = 0, totalP = 0, totalF = 0, totalC = 0;
      const container = document.getElementById('mealsContainer');
      container.innerHTML = '';

      meals.forEach(meal => {
        const items = currentDiary[meal] || [];
        let mealK = 0;
        items.forEach(i => { mealK += i.calories || 0; totalK += i.calories || 0; totalP += i.protein || 0; totalF += i.fat || 0; totalC += i.carbs || 0; });
        container.innerHTML += `<div class="card meal-card" onclick="showMeal('${meal}')" style="cursor:pointer;">
          <div class="meal-icon">${mealIcons[meal]}</div>
          <div class="meal-info"><div class="meal-name">${meal}</div><div class="meal-kcal">${mealK} ккал</div></div>
          <a href="add.html?meal=${encodeURIComponent(meal)}" onclick="event.stopPropagation()"><button class="add-btn">+</button></a>
        </div>`;
      });

      const remaining = Math.max(0, goal - totalK);
      const percent = Math.min(100, (totalK / goal) * 100);
      const degrees = percent * 3.6;

      document.getElementById('eaten').textContent = totalK;
      document.getElementById('remaining').textContent = remaining;
      document.getElementById('calorieRing').style.background = `conic-gradient(var(--sage) ${degrees}deg, var(--sage-light) ${degrees}deg)`;

      document.getElementById('macroP').textContent = totalP.toFixed(0) + ' / 90 г';
      document.getElementById('macroF').textContent = totalF.toFixed(0) + ' / 70 г';
      document.getElementById('macroC').textContent = totalC.toFixed(0) + ' / 200 г';
      document.getElementById('barP').style.width = Math.min(100, totalP / 90 * 100) + '%';
      document.getElementById('barF').style.width = Math.min(100, totalF / 70 * 100) + '%';
      document.getElementById('barC').style.width = Math.min(100, totalC / 200 * 100) + '%';
    }

    function showMeal(meal) {
      const items = currentDiary[meal] || [];
      document.getElementById('mealModalTitle').textContent = meal;
      const content = document.getElementById('mealModalContent');
      if (!items.length) {
        content.innerHTML = '<div style="text-align:center; color:var(--text-light); padding:20px;">Пока пусто</div>';
      } else {
        content.innerHTML = items.map(i =>
          `<div class="food-entry"><span>${i.name} (${i.grams} г)</span><b>${i.calories} ккал</b></div>`
        ).join('');
      }
      document.getElementById('mealModal').classList.add('show');
    }

    function showDay() {
      document.getElementById('mealModalTitle').textContent = 'Весь день';
      const content = document.getElementById('mealModalContent');
      let html = '';
      meals.forEach(meal => {
        const items = currentDiary[meal] || [];
        if (items.length) {
          html += `<div style="font-weight:600; margin-top:12px;">${meal}</div>`;
          items.forEach(i => {
            html += `<div class="food-entry"><span>${i.name} (${i.grams} г)</span><b>${i.calories} ккал</b></div>`;
          });
        }
      });
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);
      const wKey = 'workouts-' + date.toISOString().slice(0,10);
      const wData = JSON.parse(localStorage.getItem(wKey) || '[]');
      if (wData.length) {
        html += `<div style="font-weight:600; margin-top:12px;">Тренировки</div>`;
        wData.forEach(w => { html += formatWorkout(w); });
      }
      content.innerHTML = html || '<div style="text-align:center; color:var(--text-light); padding:20px;">День пустой</div>';
      document.getElementById('mealModal').classList.add('show');
    }

    function closeMealModal() {
      document.getElementById('mealModal').classList.remove('show');
    }

    updateDate();
    loadDiary();
  </script>
</body>
</html>
