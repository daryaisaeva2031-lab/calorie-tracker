<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-login4">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;">
    <h1 style="color:#F3EDE0;margin-bottom:24px;">Калории</h1>
    <div id="status" style="color:#F3EDE0;margin-bottom:16px;">Нажми для входа</div>
    <button onclick="login()" style="padding:14px 32px;border:none;border-radius:14px;background:#F3EDE0;color:#3F4630;font-weight:700;font-size:16px;">Войти через Google</button>
  </div>
  <script>
    const CLIENT_ID = '261846159655-3d5mop7bgr7hk7kh2clbgvr383elfcri.apps.googleusercontent.com';
    const REDIRECT = 'https://daryaisaeva2031-lab.github.io/calorie-tracker/login.html';

    // Handle return from Google
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('id_token') || params.get('access_token');
    if (token) {
      localStorage.setItem('gtoken', token);
      document.getElementById('status').textContent = 'Вошли! Переход...';
      setTimeout(() => location.href = 'index.html', 500);
    }

    function login() {
      const url = 'https://accounts.google.com/o/oauth2/v2/auth?' +
        'client_id=' + CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(REDIRECT) +
        '&response_type=id_token' +
        '&scope=openid email profile' +
        '&nonce=' + Math.random().toString(36).slice(2);
      location.href = url;
    }
  </script>
</body>
</html>
