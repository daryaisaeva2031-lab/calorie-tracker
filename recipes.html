<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рецепты — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="products.html"><button class="icon-btn">←</button></a>
      <h1>Рецепты</h1>
      <button class="icon-btn" onclick="add()">+</button>
    </header>
    <div id="list" style="padding:12px;"></div>
    <nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 11.5 12 5l7.5 6.5"/><path d="M6.5 10.5V19h11v-8.5"/></svg></span>Сегодня</a>
  <a href="products.html" class="nav-item active"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10z"/></svg></span>Продукты</a>
  <a href="weight.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4.5" y="5.5" width="15" height="14.2" rx="3"/><rect x="8" y="8" width="8" height="2.3" rx=".7"/><circle cx="12" cy="14.4" r="2.5"/></svg></span>Вес</a>
  <a href="menu.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Меню</a>
  <a href="workouts.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 9v6M18 9v6M3 10v4M21 10v4M6 12h12"/></svg></span>Тренировки</a>
</nav>

  </div>
  <script>
    let recipes = [];
    async function load() {
      if (!CalAPI.getToken()) { document.getElementById('list').innerHTML = '<div style="text-align:center;padding:40px;">Войди на главной</div>'; return; }
      recipes = await CalAPI.recipes.list() || [];
      render();
    }
    function render() {
      document.getElementById('list').innerHTML = recipes.map(r => `<div style="background:#F3EDE0;border-radius:12px;padding:12px;margin-bottom:8px;"><div style="font-weight:600;">${r.name}</div><div style="font-size:12px;color:#888;">${r.per100?.calories||0} ккал/100г</div></div>`).join('') || '<div style="text-align:center;color:#888;">Пока нет рецептов</div>';
    }
    async function add() {
      const name = prompt('Название блюда:');
      if (!name) return;
      recipes.push({ id: Date.now(), name, ingredients: [], per100: { calories: 0, protein: 0, fat: 0, carbs: 0 } });
      await CalAPI.recipes.save(recipes);
      render();
    }
    load();
  </script>
</body>
</html>
