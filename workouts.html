<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="sync-shim.js?v=20261118-session"></script>
  <script src="app-ui.js?v=20261118-session"></script>
  <script type="module" src="sync.js?v=20261118-del2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировки — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-session">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .workout-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .w-btn { padding: 14px 10px; border-radius: 16px; border: none; background: var(--sage-light); color: var(--sage-dark); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    .w-btn .icon { font-size: 22px; }
    .w-btn .title { font-weight: 700; letter-spacing: 0.5px; }
    .w-btn .sub { font-size: 12px; font-weight: 500; opacity: 0.8; }
    .steps-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .steps-input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--sage-light); font-family: inherit; font-size: 15px; }
    .steps-btn { padding: 12px 16px; border: none; border-radius: 12px; background: var(--sage); color: white; font-family: inherit; font-weight: 600; cursor: pointer; }
    .workout-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--sage-light); }
    .workout-details { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--text-light); }
    .kg-badge { background: var(--sage); color: white; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; }
    .load-badge { display: flex; align-items: center; gap: 4px; }
    .load-sq { width: 12px; height: 12px; border-radius: 3px; }
    .load-easy { background: #a8d5a2; }
    .load-mid { background: #f5d76e; }
    .load-hard { background: #e8a0a0; }
    .modal-overlay, .calendar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.show, .calendar-overlay.show { display: flex; }
    .modal-box, .calendar-modal { background: var(--cream); border-radius: 20px; width: 90%; max-width: 400px; padding: 20px 16px; max-height: 85vh; overflow-y: auto; }
    .modal-btn { width: 100%; padding: 12px; border: none; border-radius: 14px; background: var(--sage); color: white; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-title { font-size: 18px; font-weight: 700; color: var(--sage-dark); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-weekday { font-size: 12px; color: var(--text-light); padding: 6px 0; }
    .cal-day { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; background: transparent; position: relative; }
    .cal-day.today { background: var(--sage); color: white; font-weight: 700; }
    .cal-day.selected { outline: 2px solid var(--sage); }
    .cal-day.other { color: #ccc; }
    .cal-day:hover { background: var(--sage-light); }
    .cal-icons { font-size: 9px; line-height: 1; margin-top: 1px; }
    .week-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; background: white; border-radius: 10px; padding: 4px; }
    .week-label { padding: 4px 6px; border-radius: 8px; color: white; font-size: 10px; font-weight: 600; min-width: 50px; text-align: center; }
    .workout-plaque { flex: 1; padding: 4px 2px; border-radius: 6px; border: 2px solid var(--sage-light); background: white; cursor: pointer; font-size: 10px; font-family: inherit; font-weight: 600; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 32px; }
    .workout-plaque:hover { border-color: var(--sage); }
    .workout-plaque.done { background: var(--sage); border-color: var(--sage); color: white; }
    .plaque-top { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: center; }
    .plaque-date { font-size: 9px; opacity: 0.8; }
    .load-dot { width: 8px; height: 8px; border-radius: 2px; }
    .kg-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .kg-btn { padding: 8px 12px; border-radius: 10px; border: 2px solid var(--sage-light); background: white; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; }
    .kg-btn.selected { background: var(--sage); border-color: var(--sage); color: white; }
    .kg-custom { width: 70px; padding: 8px; border-radius: 10px; border: 2px solid var(--sage-light); font-family: inherit; font-size: 13px; text-align: center; }
    .kg-list { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
    .kg-tag { background: var(--sage); color: white; padding: 4px 8px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .kg-tag .remove { cursor: pointer; font-weight: 700; }
    .date-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--sage-light); font-family: inherit; font-size: 14px; margin-bottom: 12px; }
    .load-btns { display: flex; gap: 8px; margin-bottom: 12px; }
    .load-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; }
    .load-btn.easy { background: #a8d5a2; }
    .load-btn.mid { background: #f5d76e; }
    .load-btn.hard { background: #e8a0a0; }
    .load-btn.selected { border-color: var(--sage-dark); }
    .done-check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
    .done-check input { width: 20px; height: 20px; }
    .block-section { margin-bottom: 10px; padding: 8px; border-radius: 10px; }
    .block-title { font-weight: 700; margin-bottom: 6px; font-size: 14px; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-row .modal-btn { margin-top: 0; flex: 1; }
    .reset-btn { padding: 12px; border: none; border-radius: 14px; background: #e8a0a0; color: white; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .block-legkaya { background: #e8f0fa; }
    .block-zhenstvennaya { background: #e8f5e8; }
    .block-zhivaya { background: #e0f0e0; }
    .block-izyashchnaya { background: #faf8e0; }
    .block-mudraya { background: #fae8d0; }
    .block-kompaktnaya { background: #fae0d8; }
    .block-goryachaya { background: #fae0ea; }
    .block-spokoinaya { background: #f0e8fa; }
    .day-info { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--sage-light); }
    .day-stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--sage-light); font-size: 14px; }
    .header h1.page-title { flex: 1; text-align: center; }
    .pool-choice { display: flex; gap: 8px; margin: 8px 0 12px; }
    .pool-choice label {
      flex: 1; text-align: center; padding: 10px; border-radius: 12px;
      background: var(--beige, #F5F0E6); font-weight: 700; cursor: pointer;
    }
    .pool-choice input { display: none; }
    .pool-choice label:has(input:checked) { background: var(--pale); outline: 2px solid var(--olive); }

  </style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Калории">

</head>
<body>
  <div class="app">
    <header class="header">
      <button class="icon-btn" onclick="openCalendar()" aria-label="Календарь"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3.5v3M16 3.5v3M3.5 9.5h17"/></svg></button>
      <h1 class="page-title">Тренировки</h1>
      <div style="width:42px"></div>
    </header>
    <div class="day-switch">
      <button class="arrow" onclick="changeDay(-1)" aria-label="Предыдущий день"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg></button>
      <div class="date" id="day-date">Сегодня</div>
      <button class="arrow" onclick="changeDay(1)" aria-label="Следующий день"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5 15 12l-5.5 5.5"/></svg></button>
    </div>
    <div class="steps-row"><input type="number" class="steps-input" id="stepsInput" placeholder="Шаги"><button class="steps-btn" onclick="saveSteps()">Ок</button></div>
    <div class="workout-btns">
      <button class="w-btn" onclick="openPool()"><span class="icon">💧</span><span class="title">БАССЕЙН</span></button>
      <button class="w-btn" onclick="openOwn()"><span class="icon">🌿</span><span class="title">СВОЯ</span><span class="sub">тренировка</span></button>
      <button class="w-btn" onclick="openWarmup()"><span class="icon">💚</span><span class="title">СЕМЬЯ</span><span class="sub">разминки</span></button>
      <button class="w-btn" onclick="openFamily()"><span class="icon">💜</span><span class="title">СЕМЬЯ</span><span class="sub">силовые</span></button>
    </div>
    <div class="card"><div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px;"><div style="font-weight:600;" id="listTitle">На сегодня</div><div id="stepsDisplay" style="font-size:13px; font-weight:600; color:var(--ink-soft);"></div></div><div id="todayList"></div></div>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 12 5l7.5 6.5"/><path d="M6.5 10.5V19h11v-8.5"/></svg></span>Сегодня</a>
      <a href="products.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c6-1 11-5 13.5-13.5C10 5 5 10 5 19Z"/><path d="M8.5 14.5c2 0 5-2.5 6.5-6"/></svg></span>Продукты</a>
      <a href="weight.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="5.5" width="15" height="14.2" rx="3"/><rect x="8" y="8" width="8" height="2.3" rx=".7"/><circle cx="12" cy="14.4" r="2.5"/><path d="M12 14.4 13.3 12.8"/></svg></span>Вес</a>
      <a href="menu.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5h9.5A2.5 2.5 0 0 1 20 7v12.5H8A2.5 2.5 0 0 1 5.5 17V7A2.5 2.5 0 0 1 8 4.5Z"/><path d="M9.5 9.5h7M9.5 13h7M9.5 16.5h4.5"/></svg></span>Меню</a>
      <a href="workouts.html" class="nav-item active"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 9.2v5.6M17.8 9.2v5.6"/><path d="M8.2 7.6v8.8M15.8 7.6v8.8"/><path d="M8.2 12h7.6"/><path d="M4.8 10.2h1.4v3.6H4.8zM17.8 10.2h1.4v3.6H17.8z"/></svg></span>Тренировки</a>
    </nav>
  </div>

  <div class="calendar-overlay" id="calOverlay" onclick="if(event.target===this) closeCalendar()">
    <div class="calendar-modal">
      <div class="cal-header">
        <button class="icon-btn" onclick="changeMonth(-1)">←</button>
        <div class="cal-title" id="calMonthTitle">Ноябрь 2026</div>
        <button class="icon-btn" onclick="changeMonth(1)">→</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-info" id="dayInfo" style="display:none;"></div>
      <button onclick="goToDay()" id="goToDayBtn" style="display:none; margin-top:12px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage-light); color:var(--sage-dark); font-family:inherit; font-size:15px; font-weight:600;">Перейти к дню</button>
      <button onclick="closeCalendar()" style="margin-top:12px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage); color:white; font-family:inherit; font-size:15px; font-weight:600;">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="ownModal" onclick="if(event.target===this) closeModal('ownModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Своя тренировка</div>
      <input type="text" class="steps-input" id="ownName" placeholder="Название" style="width:100%; margin-bottom:8px;">
      <textarea class="steps-input" id="ownComment" placeholder="Комментарий" style="width:100%; height:60px;"></textarea>
      <button class="modal-btn" onclick="saveOwn()">Добавить</button>
    </div>
  </div>

  <div class="modal-overlay" id="familyModal" onclick="if(event.target===this) closeModal('familyModal')">
    <div class="modal-box" onclick="event.stopPropagation()" style="max-width:420px;">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">💜 СЕМЬЯ силовые</div>
      <div id="familyContent"></div>
      <button onclick="closeModal('familyModal')" style="margin-top:12px; width:100%; padding:10px; border:none; border-radius:14px; background:var(--sage); color:white; font-family:inherit; font-size:14px; font-weight:600;">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="workoutDetailModal" style="z-index:200;" onclick="if(event.target===this) closeModal('workoutDetailModal')">
    <div class="modal-box" style="max-width:340px;" onclick="event.stopPropagation()">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;" id="workoutDetailTitle">Тренировка</div>
      <div style="font-size:13px; color:var(--text-light); margin-bottom:6px;">Дата</div>
      <input type="date" class="date-input" id="workoutDate">
      <div style="font-size:13px; color:var(--text-light); margin-bottom:6px;">Килограммы (можно несколько)</div>
      <div class="kg-btns" id="kgBtns"></div>
      <div class="kg-list" id="kgList"></div>
      <div style="font-size:13px; color:var(--text-light); margin-bottom:6px;">Нагрузка</div>
      <div class="load-btns">
        <button class="load-btn easy" id="loadEasy" onclick="setLoad(1)">легко</button>
        <button class="load-btn mid" id="loadMid" onclick="setLoad(2)">средне</button>
        <button class="load-btn hard" id="loadHard" onclick="setLoad(3)">трудно</button>
      </div>
      <label class="done-check"><input type="checkbox" id="workoutDone"> Сделана</label>
      <textarea class="steps-input" id="workoutComment" placeholder="Комментарий" style="width:100%; height:50px;"></textarea>
      <div class="btn-row">
        <button class="reset-btn" onclick="resetWorkout()">Сбросить</button>
        <button class="modal-btn" onclick="saveWorkoutDetail()">Готово</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="poolModal" onclick="if(event.target===this) closeModal('poolModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Бассейн</div>
      <div class="pool-choice">
        <label><input type="radio" name="poolPlace" value="Кама" checked> Кама</label>
        <label><input type="radio" name="poolPlace" value="Олимпия"> Олимпия</label>
      </div>
      <input type="number" class="steps-input" id="poolMeters" placeholder="Метры" style="width:100%; margin-bottom:8px;">
      <textarea class="steps-input" id="poolComment" placeholder="Комментарий" style="width:100%; height:60px;"></textarea>
      <button class="modal-btn" onclick="savePool()">Добавить</button>
    </div>
  </div>

  <div class="modal-overlay" id="blockEditModal" style="z-index:200;" onclick="if(event.target===this) closeModal('blockEditModal')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;" id="editBlockTitle">Изменить блок</div>
      <input type="text" class="steps-input" id="editBlockName" placeholder="Название" style="width:100%; margin-bottom:8px;">
      <input type="text" class="steps-input" id="editBlockKg" placeholder="Кг, например 5–7 кг" style="width:100%; margin-bottom:8px;">
      <input type="number" class="steps-input" id="editBlockDays" min="1" max="7" placeholder="Раз в неделю" style="width:100%; margin-bottom:8px;">
      <button class="modal-btn" onclick="saveEditBlock()">Сохранить</button>
    </div>
  </div>

  <div class="modal-overlay" id="warmupModal" onclick="if(event.target===this) closeModal('warmupModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Семья — разминки</div>
      <input type="text" class="steps-input" id="warmupSearch" placeholder="Начни писать..." style="width:100%; margin-bottom:8px;" oninput="filterWarmups()">
      <div id="warmupList" style="max-height:300px; overflow-y:auto;"></div>
      <div class="block-add" style="margin-top:10px;">
        <input type="text" class="steps-input" id="newWarmupName" placeholder="Новая разминка" style="width:100%; margin-bottom:8px;">
        <button class="modal-btn" onclick="addWarmupDef()">Добавить разминку</button>
      </div>
      <button class="modal-btn" onclick="closeModal('warmupModal')" style="margin-top:8px; background:var(--sage-light); color:var(--sage-dark);">Закрыть</button>
    </div>
  </div>

  <script>
    let dayOffset = 0;
    let calMonth = new Date().getMonth();
    let calYear = new Date().getFullYear();
    let selectedCalDay = null;
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const monthsNom = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    const typeIcons = { pool: '💧', family: '💜', warmup: '💚', own: '🌿' };
    let workouts = [], steps = '', key = '', stepsKey = '';
    const kgPresets = [1, 3, 5, 7];
    const loadNames = ['','легко','средне','трудно'];
    const loadClasses = ['','load-easy','load-mid','load-hard'];
    const DEFAULT_BLOCKS = [
      {id:'legkaya', name:'Лёгкая сила', kg:'2-3 кг', color:'#7ba3d4', days: 3},
      {id:'zhenstvennaya', name:'Женственная сила', kg:'4-5 кг', color:'#a8d4a8', days: 3},
      {id:'zhivaya', name:'Живая сила', kg:'5-7 кг', color:'#7cb87c', days: 3},
      {id:'izyashchnaya', name:'Изящная сила', kg:'7-8 кг', color:'#e8d44a', days: 3},
      {id:'mudraya', name:'Мудрая сила', kg:'9-10 кг', color:'#e8a04a', days: 3},
      {id:'kompaktnaya', name:'Компактная сила', kg:'5+7+10 кг', color:'#e07a6a', days: 5},
      {id:'goryachaya', name:'Горячая сила', kg:'гиря 12 кг', color:'#e88bb8', days: 3},
      {id:'spokoinaya', name:'Спокойная сила', kg:'14 кг', color:'#9b7ed9', days: 2}
    ];
    let allBlockData = {}, editingWorkoutId = null, editingBlockId = null, tempKgList = [], tempLoad = 0;
    const DEFAULT_WARMUPS = [
      'РАЗМИНКА #1 позвоночник, грудной сегмент',
      'РАЗМИНКА #2 тазобедренный сустав (тбс)',
      'РАЗМИНКА #3 позвоночник, равномерное движение',
      'РАЗМИНКА #4 шея',
      'РАЗМИНКА #5 таз, тазовое дно, поясница',
      'РАЗМИНКА #6 с роллом, акцент в грудной отдел',
      'РАЗМИНКА #7 лопатки, с мячиком и роллом',
      'РАЗМИНКА #8 стопа',
      'РАЗМИНКА #9 дыхание, с лентой',
      'РАЗМИНКА #10 все тело, с роллом',
      'РАЗМИНКА #11 таз',
      'РАЗМИНКА #12 стопы, голеностоп, с палочкой',
      'РАЗМИНКА #13 грудной сегмент, лопатки, с лентой',
      'РАЗМИНКА #14 экспресс с палочкой',
      'РАЗМИНКА #15 экспресс на грудной сегмент',

    function changeDay(delta) { dayOffset += delta; loadDay(); }
    function loadDay() {
      const date = new Date(); date.setDate(date.getDate() + dayOffset);
      const dateStr = localDateStr(date);
      key = 'workouts-' + dateStr; stepsKey = 'steps-' + dateStr;
      workouts = JSON.parse(localStorage.getItem(key) || '[]');
      steps = localStorage.getItem(stepsKey) || '';
      let label = date.getDate() + ' ' + months[date.getMonth()];
      if (dayOffset === 0) label = 'Сегодня, ' + label;
      else if (dayOffset === -1) label = 'Вчера, ' + label;
      else if (dayOffset === 1) label = 'Завтра, ' + label;
      document.getElementById('day-date').textContent = label;
      document.getElementById('listTitle').textContent = dayOffset === 0 ? 'На сегодня' : 'Тренировки';
      render();
    }
    function openCalendar() {
      const viewed = new Date();
      viewed.setDate(viewed.getDate() + dayOffset);
      calMonth = viewed.getMonth();
      calYear = viewed.getFullYear();
      selectedCalDay = viewed.getDate();
      renderCalendar();
      showDayInfo(selectedCalDay);
      document.getElementById('calOverlay').classList.add('show');
    }
    function closeCalendar() {
      document.getElementById('calOverlay').classList.remove('show');
    }
    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      if (calMonth < 0) { calMonth = 11; calYear--; }
      const viewed = new Date(); viewed.setDate(viewed.getDate() + dayOffset);
      const today = new Date();
      if (viewed.getMonth() === calMonth && viewed.getFullYear() === calYear) {
        selectedCalDay = viewed.getDate();
        renderCalendar();
        showDayInfo(selectedCalDay);
      } else if (today.getMonth() === calMonth && today.getFullYear() === calYear) {
        selectedCalDay = today.getDate();
        renderCalendar();
        showDayInfo(selectedCalDay);
      } else {
        selectedCalDay = null;
        document.getElementById('dayInfo').style.display = 'none';
        document.getElementById('goToDayBtn').style.display = 'none';
        renderCalendar();
      }
    }
    function renderCalendar() {
      document.getElementById('calMonthTitle').textContent = monthsNom[calMonth] + ' ' + calYear;
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      weekdays.forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = d;
        grid.appendChild(el);
      });
      const first = new Date(calYear, calMonth, 1);
      let start = first.getDay() - 1;
      if (start < 0) start = 6;
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const today = new Date();
      for (let i = 0; i < start; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day other';
        grid.appendChild(el);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const el = document.createElement('div');
        el.className = 'cal-day';
        if (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear()) {
          el.classList.add('today');
        }
        if (d === selectedCalDay) el.classList.add('selected');
        const dateStr = localDateYMD(calYear, calMonth, d);
        const wKey = 'workouts-' + dateStr;
        const wData = JSON.parse(localStorage.getItem(wKey) || '[]');
        let icons = '';
        if (wData.length) {
          const types = [...new Set(wData.map(w => w.type))];
          icons = types.map(t => typeIcons[t] || '').join('');
        }
        el.innerHTML = d + (icons ? `<div class="cal-icons">${icons}</div>` : '');
        el.onclick = () => showDayInfo(d);
        grid.appendChild(el);
      }
    }
    function showDayInfo(day) {
      selectedCalDay = day;
      renderCalendar();
      const dateStr = localDateYMD(calYear, calMonth, day);
      const wData = JSON.parse(localStorage.getItem('workouts-' + dateStr) || '[]');
      const stepsVal = localStorage.getItem('steps-' + dateStr) || '—';
      let html = `<div style="font-weight:700; text-align:center; margin-bottom:8px;">${day} ${months[calMonth]}</div>`;
      html += `<div class="day-stat"><span>Шаги</span><b>${stepsVal}</b></div>`;
      if (wData.length) {
        html += `<div style="font-weight:600; margin-top:10px;">Тренировки</div>`;
        wData.forEach((w, i) => {
          const extra = (w.type === 'pool' && w.meters) ? `<div style="font-size:11px; color:var(--ink-soft);">${escapeHtml(String(w.meters))} м</div>` : '';
          html += `<div style="display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--sage-light); font-size:13px;">`;
          html += `<span>${w.icon || ''}</span><div style="flex:1; min-width:0;"><div>${escapeHtml(w.name || '')}</div>${extra}${commentBlock(w.comment, 'cal-'+dateStr+'-'+i)}</div></div>`;
        });
      } else {
        html += `<div style="color:var(--text-light); margin-top:10px; text-align:center; font-size:13px;">Тренировок нет</div>`;
      }
      document.getElementById('dayInfo').innerHTML = html;
      document.getElementById('dayInfo').style.display = 'block';
      document.getElementById('goToDayBtn').style.display = 'block';
    }
    function goToDay() {
      if (selectedCalDay) {
        const selected = new Date(calYear, calMonth, selectedCalDay);
        const today = new Date();
        today.setHours(0,0,0,0);
        dayOffset = Math.round((selected - today) / 86400000);
        loadDay();
      }
      closeCalendar();
    }
    function render() {
      const list = document.getElementById('todayList');
      if (!workouts.length) { list.innerHTML = '<div style="color:var(--text-light); text-align:center; padding:12px;">Пока пусто</div>'; }

        list.innerHTML = workouts.map((w, i) => {
          let detailsHtml = '';
          if (w.week && w.day) {
            detailsHtml = `<div class="workout-details">Нед. ${w.week}, трен. ${w.day}`;
            if (w.kg) detailsHtml += ` <span class="kg-badge">${w.kg}</span>`;
            if (w.load) {
              const loadIdx = loadNames.indexOf(w.load);
              const lc = loadClasses[loadIdx] || '';
              detailsHtml += ` <span class="load-badge"><span class="load-sq ${lc}"></span>${w.load}</span>`;
            }
            detailsHtml += `</div>`;
          } else if (w.type === 'pool' && w.meters) {
            detailsHtml = `<div class="workout-details">${escapeHtml(String(w.meters))} м</div>`;
          }
          return `<div class="workout-item"><span>${w.icon || '💜'}</span><div style="flex:1; min-width:0;"><div>${escapeHtml(w.name || '')}</div>${detailsHtml}${commentBlock(w.comment, 'w'+i)}</div><button onclick="removeWorkout(${i})" style="border:none; background:none; color:#c00; cursor:pointer;">×</button></div>`;
        }).join('');

      allBlockData = {};
      blocks.forEach(block => {
        const data = JSON.parse(localStorage.getItem('familyBlock-' + block.id) || '{}');
        if (!data.workouts) data.workouts = {};
        allBlockData[block.id] = data;
      });

    function getWorkout(blockId, workoutId) {
      if (!allBlockData[blockId]) allBlockData[blockId] = { workouts: {} };
      if (!allBlockData[blockId].workouts[workoutId]) allBlockData[blockId].workouts[workoutId] = { done: false, kg: '', kgList: [], load: 0, comment: '', dateStr: '' };
      return allBlockData[blockId].workouts[workoutId];
    }
    function loadClass(load) { return ['','load-easy','load-mid','load-hard'][load] || ''; }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return dateStr;
      return parts[2].padStart(2,'0') + '.' + parts[1].padStart(2,'0') + '.' + String(parts[0]).slice(-2);
    }

        html += `<div class="block-section block-${block.id}"><div class="block-title" style="color:${block.color}; display:flex; align-items:center; gap:6px;"><span style="flex:1;">${escapeHtml(block.name)} <span style="font-weight:500; opacity:0.7;">${escapeHtml(block.kg || '')} · ${block.days}р/нед</span></span><span class="block-edit-btns"><button type="button" class="icon-action" data-edit-block="${block.id}" aria-label="Изменить">✏️</button><button type="button" class="icon-action danger" data-del-block="${block.id}" aria-label="Удалить">🗑</button></span></div>`;
        for (let w = 1; w <= 4; w++) {
          html += `<div class="week-row"><div class="week-label" style="background:${block.color};">Неделя ${w}</div>`;
          for (let d = 1; d <= block.days; d++) {
            const id = `w${w}d${d}`, data = getWorkout(block.id, id);
            const doneClass = data.done ? 'done' : '';
            const mark = data.done ? '✓' : '';
            const kgText = data.kgList && data.kgList.length ? data.kgList.join('+') : (data.kg || '—');

      const days = +document.getElementById('newBlockDays').value;
      if (!name) { alert('Введи название'); return; }
      if (!days || days < 1 || days > 7) { alert('Сколько раз в неделю: от 1 до 7'); return; }
      const palette = ['#7ba3d4','#a8d4a8','#7cb87c','#e8d44a','#e8a04a','#e07a6a','#e88bb8','#9b7ed9'];
      const used = new Set(blocks.map(b => b.color));
      const color = palette.find(c => !used.has(c)) || palette[blocks.length % palette.length];
      const id = 'custom-' + Date.now();
      blocks.push({ id, name, kg, color, days });
      persistFamilyBlocks();
      loadAllBlocks();

      }
      container.innerHTML = tempKgList.map((kg, i) =>
        `<span class="kg-tag">${kg}<span class="remove" onclick="removeKg(${i})">×</span></span>`
      ).join('');
    }
    function addKg(kg) {
      if (!tempKgList.includes(kg)) {
        tempKgList.push(kg);
        renderKgList();
      }
    }
    function addCustomKg() {
      const val = document.getElementById('customKg').value;
      if (val) {
        addKg(val + ' кг');
        document.getElementById('customKg').value = '';
      }
    }
    function removeKg(i) {
      tempKgList.splice(i, 1);
      renderKgList();
    }
    function setLoad(l) { tempLoad = tempLoad === l ? 0 : l; updateLoadBtns(); }
    function updateLoadBtns() {
      document.getElementById('loadEasy').classList.toggle('selected', tempLoad === 1);
      document.getElementById('loadMid').classList.toggle('selected', tempLoad === 2);
      document.getElementById('loadHard').classList.toggle('selected', tempLoad === 3);
    }
    function resetWorkout() {
      if (!editingWorkoutId || !editingBlockId) return;
      const data = allBlockData[editingBlockId].workouts[editingWorkoutId];
      if (data && data.dateStr) {
        const targetKey = 'workouts-' + data.dateStr;
        let targetWorkouts = JSON.parse(localStorage.getItem(targetKey) || '[]');
        const match = editingWorkoutId.match(/w(\d+)d(\d+)/);
        if (match) {
          const week = parseInt(match[1]), day = parseInt(match[2]);
          targetWorkouts = targetWorkouts.filter(tw => !(tw.block === editingBlockId && tw.week === week && tw.day === day));
          localStorage.setItem(targetKey, JSON.stringify(targetWorkouts));
        }
      }
      allBlockData[editingBlockId].workouts[editingWorkoutId] = { done: false, kg: '', kgList: [], load: 0, comment: '', dateStr: '' };
      localStorage.setItem('familyBlock-' + editingBlockId, JSON.stringify(allBlockData[editingBlockId]));
      closeModal('workoutDetailModal');
      renderAllBlocks();
      loadDay();
    }
    function saveWorkoutDetail() {
      const data = getWorkout(editingBlockId, editingWorkoutId);
      const prevDate = data.dateStr || '';
      data.kgList = [...tempKgList];
      data.kg = tempKgList.join('+');
      data.load = tempLoad;
      data.dateStr = document.getElementById('workoutDate').value;
      data.done = document.getElementById('workoutDone').checked;
      data.comment = document.getElementById('workoutComment').value;
      localStorage.setItem('familyBlock-' + editingBlockId, JSON.stringify(allBlockData[editingBlockId]));
      const match = editingWorkoutId.match(/w(\d+)d(\d+)/);
      const week = match ? parseInt(match[1]) : null;
      const day = match ? parseInt(match[2]) : null;
      const isThis = tw => tw.block === editingBlockId && tw.week === week && tw.day === day;
      if (prevDate && prevDate !== data.dateStr) {
        const oldKey = 'workouts-' + prevDate;
        let oldList = JSON.parse(localStorage.getItem(oldKey) || '[]');
        localStorage.setItem(oldKey, JSON.stringify(oldList.filter(tw => !isThis(tw))));
      }
      if (match && data.dateStr) {
        const block = blocks.find(b => b.id === editingBlockId);
        const targetKey = 'workouts-' + data.dateStr;
        let targetWorkouts = JSON.parse(localStorage.getItem(targetKey) || '[]');
        if (data.done) {
          const entry = {
            type: 'family', name: block.name, icon: '💜', block: editingBlockId,
            week, day, kg: data.kg || '', load: loadNames[data.load] || '', loadIdx: data.load,
            comment: data.comment || ''
          };
          const idx = targetWorkouts.findIndex(isThis);
          if (idx >= 0) targetWorkouts[idx] = Object.assign({}, targetWorkouts[idx], entry);
          else targetWorkouts.push(entry);
        } else {
          targetWorkouts = targetWorkouts.filter(tw => !isThis(tw));
        }
        localStorage.setItem(targetKey, JSON.stringify(targetWorkouts));
      }
      closeModal('workoutDetailModal');
      renderAllBlocks();
      loadDay();
    }
    function openWarmup() { filterWarmups(); document.getElementById('warmupModal').classList.add('show'); }
    function filterWarmups() {
      const q = (document.getElementById('warmupSearch').value || '').toLowerCase();
      const list = document.getElementById('warmupList');
      const rows = [];
      warmups.forEach((w, i) => {
        if (q && w.toLowerCase().indexOf(q) === -1) return;
        rows.push(`<div class="warmup-row"><div class="nm" data-i="${i}">${escapeHtml(w)}</div><button type="button" class="icon-action danger" data-del="${i}" aria-label="Удалить">🗑</button></div>`);
      });
      list.innerHTML = rows.join('') || '<div style="padding:10px; color:var(--text-light);">Нет совпадений</div>';
      list.querySelectorAll('.nm').forEach(el => {
        el.onclick = function () { addWarmup(warmups[+el.dataset.i]); };
      });
      list.querySelectorAll('[data-del]').forEach(el => {
        el.onclick = function (e) { e.stopPropagation(); deleteWarmupDef(+el.dataset.del); };
      });
    }
    function addWarmup(name) { workouts.push({ type: 'warmup', name, icon: '💚' }); save(); closeModal('warmupModal'); }
    function addWarmupDef() {
      const name = (document.getElementById('newWarmupName').value || '').trim();
      if (!name) { alert('Введи название разминки'); return; }
      warmups.push(name);
      persistWarmups();
      document.getElementById('newWarmupName').value = '';
      filterWarmups();
    }
    function deleteWarmupDef(i) {
      const name = warmups[i];
      if (!name) return;
      if (!confirm('Удалить разминку «' + name + '»?')) return;
      warmups.splice(i, 1);
      persistWarmups();
      filterWarmups();
    }
    function openOwn() { document.getElementById('ownName').value = ''; document.getElementById('ownComment').value = ''; document.getElementById('ownModal').classList.add('show'); }
    function saveOwn() {
      const name = document.getElementById('ownName').value.trim();
      if (!name) { alert('Введи название'); return; }
      workouts.push({ type: 'own', name, comment: document.getElementById('ownComment').value.trim(), icon: '🌿' });
      save(); closeModal('ownModal');
    }
    function saveSteps() { steps = document.getElementById('stepsInput').value; localStorage.setItem(stepsKey, steps); render(); }
    function removeWorkout(i) { workouts.splice(i, 1); save(); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    loadDay();
  </script>
</body>
</html>
