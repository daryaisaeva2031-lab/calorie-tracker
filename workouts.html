<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировки — Калории</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .workout-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .w-btn { padding: 14px 10px; border-radius: 16px; border: none; background: var(--sage-light); color: var(--sage-dark); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    .w-btn .icon { font-size: 22px; }
    .w-btn .title { font-weight: 700; letter-spacing: 0.5px; }
    .w-btn .sub { font-size: 12px; font-weight: 500; opacity: 0.8; }
    .steps-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .steps-input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--sage-light); font-family: inherit; font-size: 15px; }
    .steps-btn { padding: 12px 16px; border: none; border-radius: 12px; background: var(--sage); color: white; font-family: inherit; font-weight: 600; cursor: pointer; }
    .workout-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--sage-light); }
    .workout-details { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--text-light); }
    .kg-badge { background: var(--sage); color: white; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; }
    .load-badge { display: flex; align-items: center; gap: 4px; }
    .load-sq { width: 12px; height: 12px; border-radius: 3px; }
    .load-easy { background: #a8d5a2; }
    .load-mid { background: #f5d76e; }
    .load-hard { background: #e8a0a0; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--cream); border-radius: 20px; width: 90%; max-width: 400px; padding: 20px 16px; max-height: 85vh; overflow-y: auto; }
    .modal-btn { width: 100%; padding: 12px; border: none; border-radius: 14px; background: var(--sage); color: white; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .day-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
    .day-nav button { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--sage-light); color: var(--sage-dark); font-size: 16px; cursor: pointer; }
    .block-select { width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--sage-light); font-family: inherit; font-size: 15px; margin-bottom: 12px; background: white; }
    .week-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; background: white; border-radius: 12px; padding: 8px; }
    .week-label { padding: 8px 10px; border-radius: 10px; background: var(--sage); color: white; font-size: 12px; font-weight: 600; min-width: 70px; text-align: center; }
    .workout-plaque { flex: 1; padding: 8px 4px; border-radius: 10px; border: 2px solid var(--sage-light); background: white; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 50px; }
    .workout-plaque.done { background: var(--sage); border-color: var(--sage); color: white; }
    .plaque-top { display: flex; align-items: center; gap: 4px; }
    .plaque-date { font-size: 10px; opacity: 0.8; }
    .load-dot { width: 10px; height: 10px; border-radius: 2px; }
    .kg-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .kg-btn { padding: 8px 12px; border-radius: 10px; border: 2px solid var(--sage-light); background: white; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; }
    .kg-btn.selected { background: var(--sage); border-color: var(--sage); color: white; }
    .kg-custom { width: 70px; padding: 8px; border-radius: 10px; border: 2px solid var(--sage-light); font-family: inherit; font-size: 13px; text-align: center; }
    .date-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--sage-light); font-family: inherit; font-size: 14px; margin-bottom: 12px; }
    .load-btns { display: flex; gap: 8px; margin-bottom: 12px; }
    .load-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; }
    .load-btn.easy { background: #a8d5a2; }
    .load-btn.mid { background: #f5d76e; }
    .load-btn.hard { background: #e8a0a0; }
    .load-btn.selected { border-color: var(--sage-dark); }
    .done-check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
    .done-check input { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header"><h1>Тренировки</h1></header>
    <div class="day-nav">
      <button onclick="changeDay(-1)">←</button>
      <div style="text-align:center;"><div id="dayTitle" style="font-weight:700; color:var(--sage-dark);">Сегодня</div><div id="todayDate" style="font-size:13px; color:var(--text-light);"></div></div>
      <button onclick="changeDay(1)">→</button>
    </div>
    <div class="steps-row"><input type="number" class="steps-input" id="stepsInput" placeholder="Шаги"><button class="steps-btn" onclick="saveSteps()">Ок</button></div>
    <div style="font-size:13px; color:var(--text-light); margin-bottom:16px;" id="stepsDisplay"></div>
    <div class="workout-btns">
      <button class="w-btn" onclick="addSimple('pool')"><span class="icon">💧</span><span class="title">БАССЕЙН</span></button>
      <button class="w-btn" onclick="openFamily()"><span class="icon">💜</span><span class="title">СЕМЬЯ</span><span class="sub">силовые</span></button>
      <button class="w-btn" onclick="openWarmup()"><span class="icon">💚</span><span class="title">СЕМЬЯ</span><span class="sub">разминки</span></button>
      <button class="w-btn" onclick="openOwn()"><span class="icon">🌿</span><span class="title">СВОЯ</span></button>
    </div>
    <div class="card"><div style="font-weight:600; margin-bottom:8px;" id="listTitle">На сегодня</div><div id="todayList"></div></div>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">🏠<span>Сегодня</span></a>
      <a href="products.html" class="nav-item">🥦<span>Продукты</span></a>
      <a href="weight.html" class="nav-item">⚖️<span>Вес</span></a>
      <a href="menu.html" class="nav-item">📋<span>Меню</span></a>
      <a href="workouts.html" class="nav-item active">💪<span>Тренировки</span></a>
    </nav>
  </div>

  <div class="modal-overlay" id="ownModal" onclick="if(event.target===this) closeModal('ownModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Своя тренировка</div>
      <input type="text" class="steps-input" id="ownName" placeholder="Название" style="width:100%; margin-bottom:8px;">
      <textarea class="steps-input" id="ownComment" placeholder="Комментарий" style="width:100%; height:60px;"></textarea>
      <button class="modal-btn" onclick="saveOwn()">Добавить</button>
    </div>
  </div>

  <div class="modal-overlay" id="familyModal" onclick="if(event.target===this) closeModal('familyModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Семья — силовые</div>
      <select class="block-select" id="blockSelect" onchange="loadBlock()">
        <option value="zhivaya">Живая сила</option>
        <option value="sila">Сила</option>
        <option value="vynoslivost">Выносливость</option>
      </select>
      <div id="weeksContainer"></div>
      <button class="modal-btn" onclick="saveFamily()">Сохранить</button>
      <button onclick="closeModal('familyModal')" style="margin-top:8px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage-light); color:var(--sage-dark); font-family:inherit; font-size:15px; font-weight:600;">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="workoutDetailModal" style="z-index:110;" onclick="if(event.target===this) closeModal('workoutDetailModal')">
    <div class="modal-box" style="max-width:340px;" onclick="event.stopPropagation()">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;" id="workoutDetailTitle">Тренировка</div>
      <div style="font-size:13px; color:var(--text-light); margin-bottom:6px;">Дата</div>
      <input type="date" class="date-input" id="workoutDate">
      <div style="font-size:13px; color:var(--text-light); margin-bottom:6px;">Килограммы</div>
      <div class="kg-btns" id="kgBtns"></div>
      <div style="font-size:13px; color:var(--text-light); margin-bottom:6px;">Нагрузка</div>
      <div class="load-btns">
        <button class="load-btn easy" id="loadEasy" onclick="setLoad(1)">легко</button>
        <button class="load-btn mid" id="loadMid" onclick="setLoad(2)">средне</button>
        <button class="load-btn hard" id="loadHard" onclick="setLoad(3)">трудно</button>
      </div>
      <label class="done-check"><input type="checkbox" id="workoutDone"> Сделана</label>
      <textarea class="steps-input" id="workoutComment" placeholder="Комментарий" style="width:100%; height:50px;"></textarea>
      <button class="modal-btn" onclick="saveWorkoutDetail()">Готово</button>
    </div>
  </div>

  <div class="modal-overlay" id="warmupModal" onclick="if(event.target===this) closeModal('warmupModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Семья — разминки</div>
      <input type="text" class="steps-input" id="warmupSearch" placeholder="Начни писать..." style="width:100%; margin-bottom:8px;" oninput="filterWarmups()">
      <div id="warmupList" style="max-height:200px; overflow-y:auto;"></div>
      <button class="modal-btn" onclick="closeModal('warmupModal')">Закрыть</button>
    </div>
  </div>

  <script>
    let dayOffset = 0;
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    let workouts = [], steps = '', key = '', stepsKey = '';
    const kgPresets = [1, 3, 5, 7];
    const loadNames = ['','легко','средне','трудно'];
    const loadClasses = ['','load-easy','load-mid','load-hard'];
    let blockData = {}, editingWorkoutId = null, tempKg = '', tempLoad = 0;
    const warmups = ['Грудной отдел — круги руками','Грудной отдел — растяжка','Шея — наклоны','Спина — кошка','Ноги — махи','Плечи — круги'];

    function changeDay(delta) { dayOffset += delta; loadDay(); }
    function loadDay() {
      const date = new Date(); date.setDate(date.getDate() + dayOffset);
      const dateStr = date.toISOString().slice(0,10);
      key = 'workouts-' + dateStr; stepsKey = 'steps-' + dateStr;
      workouts = JSON.parse(localStorage.getItem(key) || '[]');
      steps = localStorage.getItem(stepsKey) || '';
      document.getElementById('todayDate').textContent = date.getDate() + ' ' + months[date.getMonth()];
      let title = 'Сегодня';
      if (dayOffset === -1) title = 'Вчера';
      else if (dayOffset === 1) title = 'Завтра';
      else if (dayOffset !== 0) title = date.getDate() + ' ' + months[date.getMonth()];
      document.getElementById('dayTitle').textContent = title;
      document.getElementById('listTitle').textContent = dayOffset === 0 ? 'На сегодня' : 'Тренировки';
      render();
    }
    function render() {
      const list = document.getElementById('todayList');
      if (!workouts.length) { list.innerHTML = '<div style="color:var(--text-light); text-align:center; padding:12px;">Пока пусто</div>'; }
      else {
        list.innerHTML = workouts.map((w, i) => {
          let detailsHtml = '';
          if (w.week && w.day) {
            detailsHtml = `<div class="workout-details">Нед. ${w.week}, трен. ${w.day}`;
            if (w.kg) detailsHtml += ` <span class="kg-badge">${w.kg}</span>`;
            if (w.load) {
              const loadIdx = loadNames.indexOf(w.load);
              const lc = loadClasses[loadIdx] || '';
              detailsHtml += ` <span class="load-badge"><span class="load-sq ${lc}"></span>${w.load}</span>`;
            }
            detailsHtml += `</div>`;
          }
          return `<div class="workout-item"><span>${w.icon || '💜'}</span><div style="flex:1;"><div>${w.name}</div>${detailsHtml}</div><button onclick="removeWorkout(${i})" style="border:none; background:none; color:#c00; cursor:pointer;">×</button></div>`;
        }).join('');
      }
      document.getElementById('stepsDisplay').textContent = steps ? 'Шаги: ' + steps : '';
      document.getElementById('stepsInput').value = steps;
    }
    function save() { localStorage.setItem(key, JSON.stringify(workouts)); render(); }
    function addSimple(type) { workouts.push({ type, name: 'Бассейн', icon: '💧' }); save(); }
    function openFamily() { loadBlock(); document.getElementById('familyModal').classList.add('show'); }
    function loadBlock() {
      const block = document.getElementById('blockSelect').value;
      blockData = JSON.parse(localStorage.getItem('familyBlock-' + block) || '{}');
      if (!blockData.workouts) blockData.workouts = {};
      renderWeeks();
    }
    function getWorkout(id) {
      if (!blockData.workouts[id]) blockData.workouts[id] = { done: false, kg: '', load: 0, comment: '', dateStr: '' };
      return blockData.workouts[id];
    }
    function loadClass(load) { return ['','load-easy','load-mid','load-hard'][load] || ''; }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + yy;
    }
    function renderWeeks() {
      const container = document.getElementById('weeksContainer');
      let html = '';
      for (let w = 1; w <= 4; w++) {
        html += `<div class="week-row"><div class="week-label">Неделя ${w}</div>`;
        for (let d = 1; d <= 3; d++) {
          const id = `w${w}d${d}`, data = getWorkout(id);
          const doneClass = data.done ? 'done' : '';
          const mark = data.done ? '✓' : '';
          const kgText = data.kg || '—';
          const lc = loadClass(data.load);
          const dot = lc ? `<span class="load-dot ${lc}"></span>` : '';
          const dateText = formatDate(data.dateStr);
          html += `<div class="workout-plaque ${doneClass}" onclick="openWorkoutDetail('${id}', ${w}, ${d})">`;
          html += `<div class="plaque-top">${mark ? mark + ' ' : ''}${kgText}${dot}</div>`;
          if (dateText) html += `<div class="plaque-date">${dateText}</div>`;
          html += `</div>`;
        }
        html += '</div>';
      }
      container.innerHTML = html;
    }
    function openWorkoutDetail(id, week, day) {
      editingWorkoutId = id;
      const data = getWorkout(id);
      tempKg = data.kg || '';
      tempLoad = data.load;
      document.getElementById('workoutDetailTitle').textContent = `Неделя ${week}, трен. ${day}`;
      document.getElementById('workoutDone').checked = data.done;
      document.getElementById('workoutComment').value = data.comment || '';
      document.getElementById('workoutDate').value = data.dateStr || '';
      renderKgBtns();
      updateLoadBtns();
      document.getElementById('workoutDetailModal').classList.add('show');
    }
    function renderKgBtns() {
      const container = document.getElementById('kgBtns');
      let html = kgPresets.map(kg => {
        const sel = tempKg === kg + ' кг' ? 'selected' : '';
        return `<button class="kg-btn ${sel}" onclick="setKg('${kg} кг')">${kg} кг</button>`;
      }).join('');
      const customVal = kgPresets.map(k => k + ' кг').includes(tempKg) ? '' : tempKg.replace(' кг', '');
      html += `<input type="number" class="kg-custom" id="customKg" placeholder="свой" value="${customVal}" oninput="setCustomKg(this.value)">`;
      container.innerHTML = html;
    }
    function setKg(kg) { tempKg = kg; renderKgBtns(); }
    function setCustomKg(val) { tempKg = val ? val + ' кг' : ''; }
    function setLoad(l) { tempLoad = tempLoad === l ? 0 : l; updateLoadBtns(); }
    function updateLoadBtns() {
      document.getElementById('loadEasy').classList.toggle('selected', tempLoad === 1);
      document.getElementById('loadMid').classList.toggle('selected', tempLoad === 2);
      document.getElementById('loadHard').classList.toggle('selected', tempLoad === 3);
    }
    function saveWorkoutDetail() {
      const data = getWorkout(editingWorkoutId);
      const customVal = document.getElementById('customKg').value;
      if (customVal && !kgPresets.map(k => k + ' кг').includes(tempKg)) tempKg = customVal + ' кг';
      data.kg = tempKg;
      data.load = tempLoad;
      data.dateStr = document.getElementById('workoutDate').value;
      data.done = document.getElementById('workoutDone').checked;
      data.comment = document.getElementById('workoutComment').value;
      closeModal('workoutDetailModal');
      renderWeeks();
    }
    function saveFamily() {
      const block = document.getElementById('blockSelect').value;
      const blockName = document.getElementById('blockSelect').selectedOptions[0].text;
      localStorage.setItem('familyBlock-' + block, JSON.stringify(blockData));

      for (let w = 1; w <= 4; w++) {
        for (let d = 1; d <= 3; d++) {
          const id = `w${w}d${d}`, data = blockData.workouts[id];
          if (data && data.done && data.dateStr) {
            const targetKey = 'workouts-' + data.dateStr;
            let targetWorkouts = JSON.parse(localStorage.getItem(targetKey) || '[]');
            const exists = targetWorkouts.some(tw => tw.block === block && tw.week === w && tw.day === d);
            if (!exists) {
              targetWorkouts.push({
                type: 'family', name: blockName, icon: '💜', block,
                week: w, day: d, kg: data.kg || '', load: loadNames[data.load] || '', loadIdx: data.load
              });
              localStorage.setItem(targetKey, JSON.stringify(targetWorkouts));
            }
          }
        }
      }
      loadDay();
      closeModal('familyModal');
    }
    function openWarmup() { filterWarmups(); document.getElementById('warmupModal').classList.add('show'); }
    function filterWarmups() {
      const q = (document.getElementById('warmupSearch').value || '').toLowerCase();
      const filtered = warmups.filter(w => w.toLowerCase().includes(q));
      document.getElementById('warmupList').innerHTML = filtered.map(w => `<div style="padding:10px; cursor:pointer; border-bottom:1px solid var(--sage-light);" onclick="addWarmup('${w}')">${w}</div>`).join('') || '<div style="padding:10px; color:var(--text-light);">Нет совпадений</div>';
    }
    function addWarmup(name) { workouts.push({ type: 'warmup', name, icon: '💚' }); save(); closeModal('warmupModal'); }
    function openOwn() { document.getElementById('ownName').value = ''; document.getElementById('ownComment').value = ''; document.getElementById('ownModal').classList.add('show'); }
    function saveOwn() {
      const name = document.getElementById('ownName').value.trim();
      if (!name) { alert('Введи название'); return; }
      workouts.push({ type: 'own', name, comment: document.getElementById('ownComment').value.trim(), icon: '🌿' });
      save(); closeModal('ownModal');
    }
    function saveSteps() { steps = document.getElementById('stepsInput').value; localStorage.setItem(stepsKey, steps); render(); }
    function removeWorkout(i) { workouts.splice(i, 1); save(); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    loadDay();
  </script>
</body>
</html>
