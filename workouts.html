<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировки — Калории</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .workout-btns {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
    }
    .w-btn {
      padding: 14px 10px; border-radius: 16px; border: none;
      background: var(--sage-light); color: var(--sage-dark);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 4px; text-align: center;
    }
    .w-btn .icon { font-size: 22px; }
    .w-btn .title { font-weight: 700; letter-spacing: 0.5px; }
    .w-btn .sub { font-size: 12px; font-weight: 500; opacity: 0.8; }
    .steps-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .steps-input {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--sage-light);
      font-family: inherit; font-size: 15px;
    }
    .steps-btn {
      padding: 12px 16px; border: none; border-radius: 12px;
      background: var(--sage); color: white; font-family: inherit;
      font-weight: 600; cursor: pointer;
    }
    .workout-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--sage-light);
    }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--cream); border-radius: 20px; width: 90%; max-width: 380px;
      padding: 20px 16px; max-height: 85vh; overflow-y: auto;
    }
    .modal-btn {
      width: 100%; padding: 12px; border: none; border-radius: 14px;
      background: var(--sage); color: white; font-family: inherit;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }
    .day-nav {
      display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px;
    }
    .day-nav button {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--sage-light); color: var(--sage-dark);
      font-size: 16px; cursor: pointer;
    }
    .block-select {
      width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--sage-light);
      font-family: inherit; font-size: 15px; margin-bottom: 12px;
      background: white;
    }
    .kg-badge {
      display: inline-block; padding: 6px 14px; border-radius: 20px;
      background: var(--sage); color: white; font-size: 13px; font-weight: 600;
      margin-bottom: 16px; cursor: pointer;
    }
    .week-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
      background: white; border-radius: 12px; padding: 8px;
    }
    .week-label {
      padding: 8px 12px; border-radius: 10px; background: var(--sage);
      color: white; font-size: 13px; font-weight: 600; min-width: 80px; text-align: center;
    }
    .check-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--sage-light);
      background: white; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .check-btn.done {
      background: var(--sage); border-color: var(--sage); color: white;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Тренировки</h1>
    </header>

    <div class="day-nav">
      <button onclick="changeDay(-1)">←</button>
      <div style="text-align:center;">
        <div id="dayTitle" style="font-weight:700; color:var(--sage-dark);">Сегодня</div>
        <div id="todayDate" style="font-size:13px; color:var(--text-light);"></div>
      </div>
      <button onclick="changeDay(1)">→</button>
    </div>

    <div class="steps-row">
      <input type="number" class="steps-input" id="stepsInput" placeholder="Шаги">
      <button class="steps-btn" onclick="saveSteps()">Ок</button>
    </div>
    <div style="font-size:13px; color:var(--text-light); margin-bottom:16px;" id="stepsDisplay"></div>

    <div class="workout-btns">
      <button class="w-btn" onclick="addSimple('pool')">
        <span class="icon">💧</span>
        <span class="title">БАССЕЙН</span>
      </button>
      <button class="w-btn" onclick="openFamily()">
        <span class="icon">💜</span>
        <span class="title">СЕМЬЯ</span>
        <span class="sub">силовые</span>
      </button>
      <button class="w-btn" onclick="openWarmup()">
        <span class="icon">💚</span>
        <span class="title">СЕМЬЯ</span>
        <span class="sub">разминки</span>
      </button>
      <button class="w-btn" onclick="openOwn()">
        <span class="icon">🌿</span>
        <span class="title">СВОЯ</span>
      </button>
    </div>

    <div class="card">
      <div style="font-weight:600; margin-bottom:8px;" id="listTitle">На сегодня</div>
      <div id="todayList"></div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">🏠<span>Сегодня</span></a>
      <a href="products.html" class="nav-item">🥦<span>Продукты</span></a>
      <a href="weight.html" class="nav-item">⚖️<span>Вес</span></a>
      <a href="menu.html" class="nav-item">📋<span>Меню</span></a>
      <a href="workouts.html" class="nav-item active">💪<span>Тренировки</span></a>
    </nav>
  </div>

  <div class="modal-overlay" id="ownModal" onclick="if(event.target===this) closeModal('ownModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Своя тренировка</div>
      <input type="text" class="steps-input" id="ownName" placeholder="Название" style="width:100%; margin-bottom:8px;">
      <textarea class="steps-input" id="ownComment" placeholder="Комментарий" style="width:100%; height:60px;"></textarea>
      <button class="modal-btn" onclick="saveOwn()">Добавить</button>
    </div>
  </div>

  <div class="modal-overlay" id="familyModal" onclick="if(event.target===this) closeModal('familyModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Семья — силовые</div>

      <select class="block-select" id="blockSelect" onchange="loadBlock()">
        <option value="zhivaya">Живая сила</option>
        <option value="sila">Сила</option>
        <option value="vynoslivost">Выносливость</option>
      </select>

      <div style="text-align:center;">
        <span class="kg-badge" id="kgBadge" onclick="cycleKg()">4-5 кг</span>
      </div>

      <div id="weeksContainer"></div>

      <textarea class="steps-input" id="familyComment" placeholder="Комментарий" style="width:100%; height:50px; margin-top:12px;"></textarea>

      <button class="modal-btn" onclick="saveFamily()">Сохранить</button>
      <button onclick="closeModal('familyModal')" style="margin-top:8px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--sage-light); color:var(--sage-dark); font-family:inherit; font-size:15px; font-weight:600;">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="warmupModal" onclick="if(event.target===this) closeModal('warmupModal')">
    <div class="modal-box">
      <div style="font-weight:700; text-align:center; margin-bottom:12px;">Семья — разминки</div>
      <input type="text" class="steps-input" id="warmupSearch" placeholder="Начни писать..." style="width:100%; margin-bottom:8px;" oninput="filterWarmups()">
      <div id="warmupList" style="max-height:200px; overflow-y:auto;"></div>
      <button class="modal-btn" onclick="closeModal('warmupModal')">Закрыть</button>
    </div>
  </div>

  <script>
    let dayOffset = 0;
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    let workouts = [];
    let steps = '';
    let key = '';
    let stepsKey = '';

    const kgOptions = ['2-3 кг', '4-5 кг', '6-7 кг', '8-10 кг'];
    let currentKgIndex = 1;
    let blockChecks = {};

    const warmups = [
      'Грудной отдел — круги руками',
      'Грудной отдел — растяжка',
      'Шея — наклоны',
      'Спина — кошка',
      'Ноги — махи',
      'Плечи — круги'
    ];

    function changeDay(delta) {
      dayOffset += delta;
      loadDay();
    }

    function loadDay() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);
      const dateStr = date.toISOString().slice(0,10);
      key = 'workouts-' + dateStr;
      stepsKey = 'steps-' + dateStr;
      workouts = JSON.parse(localStorage.getItem(key) || '[]');
      steps = localStorage.getItem(stepsKey) || '';

      document.getElementById('todayDate').textContent = date.getDate() + ' ' + months[date.getMonth()];

      let title = 'Сегодня';
      if (dayOffset === -1) title = 'Вчера';
      else if (dayOffset === 1) title = 'Завтра';
      else if (dayOffset !== 0) title = date.getDate() + ' ' + months[date.getMonth()];
      document.getElementById('dayTitle').textContent = title;
      document.getElementById('listTitle').textContent = dayOffset === 0 ? 'На сегодня' : 'Тренировки';

      render();
    }

    function render() {
      const list = document.getElementById('todayList');
      if (!workouts.length) {
        list.innerHTML = '<div style="color:var(--text-light); text-align:center; padding:12px;">Пока пусто</div>';
      } else {
        list.innerHTML = workouts.map((w, i) =>
          `<div class="workout-item">
            <span>${w.icon || '💜'}</span>
            <div style="flex:1;">${w.name}</div>
            <button onclick="removeWorkout(${i})" style="border:none; background:none; color:#c00; cursor:pointer;">×</button>
          </div>`
        ).join('');
      }
      document.getElementById('stepsDisplay').textContent = steps ? 'Шаги: ' + steps : '';
      document.getElementById('stepsInput').value = steps;
    }

    function save() {
      localStorage.setItem(key, JSON.stringify(workouts));
      render();
    }

    function addSimple(type) {
      const names = { pool: 'Бассейн' };
      const icons = { pool: '💧' };
      workouts.push({ type, name: names[type], icon: icons[type] });
      save();
    }

    function openFamily() {
      loadBlock();
      document.getElementById('familyModal').classList.add('show');
    }

    function loadBlock() {
      const block = document.getElementById('blockSelect').value;
      const saved = JSON.parse(localStorage.getItem('familyBlock-' + block) || '{}');
      blockChecks = saved.checks || {};
      currentKgIndex = saved.kgIndex !== undefined ? saved.kgIndex : 1;
      document.getElementById('kgBadge').textContent = kgOptions[currentKgIndex];
      document.getElementById('familyComment').value = saved.comment || '';
      renderWeeks();
    }

    function cycleKg() {
      currentKgIndex = (currentKgIndex + 1) % kgOptions.length;
      document.getElementById('kgBadge').textContent = kgOptions[currentKgIndex];
    }

    function renderWeeks() {
      const container = document.getElementById('weeksContainer');
      let html = '';
      for (let w = 1; w <= 4; w++) {
        html += `<div class="week-row"><div class="week-label">Неделя ${w}</div>`;
        for (let d = 1; d <= 3; d++) {
          const id = `w${w}d${d}`;
          const done = blockChecks[id] ? 'done' : '';
          const mark = blockChecks[id] ? '✓' : '';
          html += `<button class="check-btn ${done}" onclick="toggleCheck('${id}')">${mark}</button>`;
        }
        html += '</div>';
      }
      container.innerHTML = html;
    }

    function toggleCheck(id) {
      blockChecks[id] = !blockChecks[id];
      renderWeeks();
    }

    function saveFamily() {
      const block = document.getElementById('blockSelect').value;
      const blockName = document.getElementById('blockSelect').selectedOptions[0].text;
      const comment = document.getElementById('familyComment').value;

      localStorage.setItem('familyBlock-' + block, JSON.stringify({
        checks: blockChecks,
        kgIndex: currentKgIndex,
        comment: comment
      }));

      workouts.push({
        type: 'family',
        name: blockName + ' (' + kgOptions[currentKgIndex] + ')',
        icon: '💜',
        block: block,
        kg: kgOptions[currentKgIndex]
      });
      save();
      closeModal('familyModal');
    }

    function openWarmup() {
      filterWarmups();
      document.getElementById('warmupModal').classList.add('show');
    }

    function filterWarmups() {
      const q = (document.getElementById('warmupSearch').value || '').toLowerCase();
      const list = document.getElementById('warmupList');
      const filtered = warmups.filter(w => w.toLowerCase().includes(q));
      list.innerHTML = filtered.map(w =>
        `<div style="padding:10px; cursor:pointer; border-bottom:1px solid var(--sage-light);" onclick="addWarmup('${w}')">${w}</div>`
      ).join('') || '<div style="padding:10px; color:var(--text-light);">Нет совпадений</div>';
    }

    function addWarmup(name) {
      workouts.push({ type: 'warmup', name, icon: '💚' });
      save();
      closeModal('warmupModal');
    }

    function openOwn() {
      document.getElementById('ownName').value = '';
      document.getElementById('ownComment').value = '';
      document.getElementById('ownModal').classList.add('show');
    }

    function saveOwn() {
      const name = document.getElementById('ownName').value.trim();
      if (!name) { alert('Введи название'); return; }
      const comment = document.getElementById('ownComment').value.trim();
      workouts.push({ type: 'own', name, comment, icon: '🌿' });
      save();
      closeModal('ownModal');
    }

    function saveSteps() {
      steps = document.getElementById('stepsInput').value;
      localStorage.setItem(stepsKey, steps);
      render();
    }

    function removeWorkout(i) {
      workouts.splice(i, 1);
      save();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    loadDay();
  </script>
</body>
</html>
