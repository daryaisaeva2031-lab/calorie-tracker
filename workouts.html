<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировки — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Тренировки</h1>
    </header>
    <div style="padding:12px;">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button onclick="add('бассейн')" style="flex:1;padding:12px;border:none;border-radius:12px;background:#D6E2C8;">Бассейн</button>
        <button onclick="add('семья')" style="flex:1;padding:12px;border:none;border-radius:12px;background:#D6E2C8;">Семья</button>
        <button onclick="add('своя')" style="flex:1;padding:12px;border:none;border-radius:12px;background:#D6E2C8;">Своя</button>
      </div>
      <div id="list"></div>
    </div>
    <nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 11.5 12 5l7.5 6.5"/><path d="M6.5 10.5V19h11v-8.5"/></svg></span>Сегодня</a>
  <a href="products.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10z"/></svg></span>Продукты</a>
  <a href="weight.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4.5" y="5.5" width="15" height="14.2" rx="3"/><rect x="8" y="8" width="8" height="2.3" rx=".7"/><circle cx="12" cy="14.4" r="2.5"/></svg></span>Вес</a>
  <a href="menu.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Меню</a>
  <a href="workouts.html" class="nav-item active"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 9v6M18 9v6M3 10v4M21 10v4M6 12h12"/></svg></span>Тренировки</a>
</nav>

  </div>
  <script>
    let workouts = [];
    const date = new Date().toISOString().slice(0,10);
    async function load() {
      if (!CalAPI.getToken()) { document.getElementById('list').innerHTML = '<div style="text-align:center;padding:40px;">Войди на главной</div>'; return; }
      workouts = JSON.parse(localStorage.getItem('workouts-'+date) || '[]');
      render();
    }
    function render() {
      document.getElementById('list').innerHTML = workouts.map(w => `<div style="background:#F3EDE0;border-radius:12px;padding:10px;margin-bottom:8px;">${w.type}</div>`).join('') || '<div style="text-align:center;color:#888;">Сегодня пусто</div>';
    }
    function add(type) {
      workouts.push({ type, time: new Date().toISOString() });
      localStorage.setItem('workouts-'+date, JSON.stringify(workouts));
      render();
    }
    load();
  </script>
</body>
</html>
