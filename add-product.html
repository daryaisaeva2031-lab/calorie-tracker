<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый продукт — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="products.html"><button class="icon-btn">←</button></a>
      <h1>Новый продукт</h1>
    </header>
    <div style="padding:16px;">
      <label>Название</label><input id="name" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Ккал / 100г</label><input id="cal" type="number" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Белки</label><input id="p" type="number" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Жиры</label><input id="f" type="number" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Углеводы</label><input id="c" type="number" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <button onclick="save()" style="width:100%;padding:14px;border:none;border-radius:14px;background:#6F7B52;color:white;font-weight:600;">Сохранить</button>
    </div>
  </div>
  <script>
    async function save() {
      if (!CalAPI.getToken()) { alert('Войди на главной'); return; }
      const products = await CalAPI.products.list() || [];
      products.push({
        id: Date.now(),
        name: document.getElementById('name').value,
        calories: +document.getElementById('cal').value || 0,
        protein: +document.getElementById('p').value || 0,
        fat: +document.getElementById('f').value || 0,
        carbs: +document.getElementById('c').value || 0
      });
      await CalAPI.products.save(products);
      location.href = 'products.html';
    }
  </script>
</body>
</html>
