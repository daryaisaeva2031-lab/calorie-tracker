<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1 id="title">Добавить</h1>
    </header>
    <div style="padding:12px;">
      <input id="search" placeholder="Поиск продукта..." style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin-bottom:12px;" oninput="filter()">
      <div id="list"></div>
    </div>
  </div>
  <script>
    const meal = new URLSearchParams(location.search).get('meal') || 'Завтрак';
    document.getElementById('title').textContent = meal;
    let products = [];
    async function load() {
      if (!CalAPI.getToken()) { document.getElementById('list').innerHTML = '<div style="text-align:center;padding:40px;">Войди на главной</div>'; return; }
      products = await CalAPI.products.list() || [];
      render(products);
    }
    function render(list) {
      document.getElementById('list').innerHTML = list.map(p => `<div class="food-item" style="margin-bottom:8px;cursor:pointer;" onclick="add(${p.id})">
        <div style="flex:1;"><div style="font-weight:600;">${p.name}</div><div style="font-size:12px;color:#888;">${p.calories} ккал</div></div>
      </div>`).join('') || '<div style="text-align:center;color:#888;">Нет продуктов</div>';
    }
    function filter() {
      const q = document.getElementById('search').value.toLowerCase();
      render(products.filter(p => p.name.toLowerCase().includes(q)));
    }
    async function add(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const grams = +prompt('Граммы:', '100');
      if (!grams) return;
      const date = new Date().toISOString().slice(0, 10);
      const diary = await CalAPI.diary.get(date) || {};
      if (!diary[meal]) diary[meal] = [];
      diary[meal].push({
        type: 'product', id: p.id, name: p.name, grams,
        calories: Math.round((p.calories || 0) * grams / 100),
        protein: +((p.protein || 0) * grams / 100).toFixed(1),
        fat: +((p.fat || 0) * grams / 100).toFixed(1),
        carbs: +((p.carbs || 0) * grams / 100).toFixed(1)
      });
      await CalAPI.diary.save(date, diary);
      location.href = 'index.html';
    }
    load();
  </script>
</body>
</html>
