<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список продуктов — Калории</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .cat-badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px; margin-left: 8px;
      background: var(--sage-light); color: var(--sage-dark);
    }
    .food-item { cursor: pointer; position: relative; }
    .product-id-corner {
      position: absolute; top: 8px; right: 10px;
      font-size: 11px; color: var(--text-light);
    }
    .brand-name { font-size: 13px; color: var(--text-light); margin-top: 1px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="products.html"><button class="icon-btn">←</button></a>
      <h1>Продукты</h1>
      <a href="add-product.html"><button class="icon-btn">+</button></a>
    </header>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search" placeholder="Поиск продуктов..." oninput="render()">
    </div>

    <div id="productsList"></div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">🏠<span>Сегодня</span></a>
      <a href="products.html" class="nav-item active">🥦<span>Продукты</span></a>
      <a href="weight.html" class="nav-item">⚖️<span>Вес</span></a>
      <a href="menu.html" class="nav-item">📋<span>Меню</span></a>
      <a href="workouts.html" class="nav-item">💪<span>Тренировки</span></a>
    </nav>
  </div>

  <script>
    const defaultProducts = [
      {id: 1, name: 'Сыр пармезан', category: 'Молочные', calories: 392, brand: ''},
      {id: 2, name: 'Хлеб цельнозерновой', category: 'Выпечка', calories: 250, brand: ''},
      {id: 3, name: 'Творог 5%', category: 'Молочные', calories: 121, brand: ''},
      {id: 4, name: 'Яйцо', category: 'Другое', calories: 157, brand: ''}
    ];

    let products = JSON.parse(localStorage.getItem('products') || 'null') || defaultProducts;
    products.forEach((p, i) => { if (!p.id) p.id = i + 1; });
    localStorage.setItem('products', JSON.stringify(products));

    function render() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const list = document.getElementById('productsList');
      list.innerHTML = '';
      products.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
        const icons = {
          'Молочные': '🧀', 'Выпечка': '🍞', 'Мясо и рыба': '🍗',
          'Овощи': '🥦', 'Фрукты и ягоды': '🍎', 'Крупы': '🌾',
          'Сладости': '🍫', 'Домашнее': '🏠', 'Другое': '📦'
        };
        const icon = icons[p.category] || '🥗';
        list.innerHTML += `<div class="card food-item" onclick="location.href='add-product.html?id=${p.id}'">
          <div class="product-id-corner">ID: ${p.id}</div>
          <div class="food-icon">${icon}</div>
          <div class="food-info">
            <div class="food-name">${p.name} <span class="cat-badge">${p.category || ''}</span></div>
            ${p.brand ? `<div class="brand-name">${p.brand}</div>` : ''}
            <div class="food-kcal">${p.calories || 0} ккал / 100 г</div>
          </div>
        </div>`;
      });
    }
    render();
  </script>
</body>
</html>
