<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-login2">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="api-client.js?v=20261118-login2"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Профиль</h1>
    </header>
    <div style="padding:16px;">
      <div class="card">
        <h3>О тебе</h3>
        <label>Имя</label><input id="name" value="Дарья" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <label>Рост (см)</label><input id="height" type="number" value="164" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <label>Текущий вес</label><input id="weight" type="number" step="0.1" value="77.4" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <label>Целевой вес</label><input id="target" type="number" step="0.1" value="65" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      </div>
      <div class="card">
        <h3>Цели</h3>
        <label>Калории</label><input id="goal" type="number" value="1700" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <label>Белки %</label><input id="p" type="number" value="25" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <label>Жиры %</label><input id="f" type="number" value="40" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <label>Углеводы %</label><input id="c" type="number" value="35" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
        <button onclick="saveProfile()" style="width:100%;padding:14px;border:none;border-radius:14px;background:#6F7B52;color:white;font-weight:600;">Сохранить</button>
      </div>
      <div class="card">
        <h3>Аккаунт</h3>
        <p id="status">Не вошли</p>
        <div id="gbtn" style="margin:12px 0;"></div>
        <button onclick="logout()" style="width:100%;padding:14px;border:none;border-radius:14px;background:#ccc;">Выйти</button>
      </div>
    </div>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 12 5l7.5 6.5"/><path d="M6.5 10.5V19h11v-8.5"/></svg></span>Сегодня</a>
      <a href="products.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c6-1 11-5 13.5-13.5C10 5 5 10 5 19Z"/><path d="M8.5 14.5c2 0 5-2.5 6.5-6"/></svg></span>Продукты</a>
      <a href="weight.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="5.5" width="15" height="14.2" rx="3"/><rect x="8" y="8" width="8" height="2.3" rx=".7"/><circle cx="12" cy="14.4" r="2.5"/><path d="M12 14.4 13.3 12.8"/></svg></span>Вес</a>
      <a href="menu.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5h9.5A2.5 2.5 0 0 1 20 7v12.5H8A2.5 2.5 0 0 1 5.5 17V7A2.5 2.5 0 0 1 8 4.5Z"/><path d="M9.5 9.5h7M9.5 13h7M9.5 16.5h4.5"/></svg></span>Меню</a>
      <a href="workouts.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 9.2v5.6M17.8 9.2v5.6"/><path d="M8.2 7.6v8.8M15.8 7.6v8.8"/><path d="M8.2 12h7.6"/><path d="M4.8 10.2h1.4v3.6H4.8zM17.8 10.2h1.4v3.6H17.8z"/></svg></span>Тренировки</a>
    </nav>
  </div>
  <script>
    function initGoogle() {
      if (!window.google || !google.accounts) { setTimeout(initGoogle, 200); return; }
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: (resp) => {
          localStorage.setItem('gtoken', resp.credential);
          document.getElementById('status').textContent = 'Вошли';
        }
      });
      google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large', width: 280 });
      if (localStorage.getItem('gtoken')) document.getElementById('status').textContent = 'Вошли';
    }
    function logout() { localStorage.removeItem('gtoken'); document.getElementById('status').textContent = 'Не вошли'; }
    async function saveProfile() {
      if (!localStorage.getItem('gtoken')) { alert('Сначала войди'); return; }
      await CalAPI.profile.save({
        name: document.getElementById('name').value,
        height: +document.getElementById('height').value,
        weight: +document.getElementById('weight').value,
        target: +document.getElementById('target').value,
        goal: +document.getElementById('goal').value,
        p: +document.getElementById('p').value,
        f: +document.getElementById('f').value,
        c: +document.getElementById('c').value
      });
      alert('Сохранено');
    }
    initGoogle();
  </script>
</body>
</html>
