<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Профиль</h1>
    </header>
    <div style="padding:16px;">
      <label>Цель ккал</label><input id="goal" type="number" value="1700" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Белки %</label><input id="p" type="number" value="35" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Жиры %</label><input id="f" type="number" value="25" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <label>Углеводы %</label><input id="c" type="number" value="40" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;">
      <button onclick="save()" style="width:100%;padding:14px;border:none;border-radius:14px;background:#6F7B52;color:white;font-weight:600;">Сохранить</button>
      <button onclick="logout()" style="width:100%;padding:14px;border:none;border-radius:14px;background:#ccc;margin-top:8px;">Выйти</button>
    </div>
  </div>
  <script>
    async function load() {
      if (!CalAPI.getToken()) return;
      const p = await CalAPI.profile.get() || {};
      if (p.goal) document.getElementById('goal').value = p.goal;
      if (p.p) document.getElementById('p').value = p.p;
      if (p.f) document.getElementById('f').value = p.f;
      if (p.c) document.getElementById('c').value = p.c;
    }
    async function save() {
      await CalAPI.profile.save({
        goal: +document.getElementById('goal').value,
        p: +document.getElementById('p').value,
        f: +document.getElementById('f').value,
        c: +document.getElementById('c').value
      });
      alert('Сохранено');
    }
    function logout() { CalAPI.setToken(null); location.href = 'index.html'; }
    load();
  </script>
</body>
</html>
