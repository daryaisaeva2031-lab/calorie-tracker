<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вес — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Вес</h1>
      <button class="icon-btn" onclick="addWeight()">+</button>
    </header>
    <div id="list" style="padding:12px;"></div>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><span class="nav-ic"></span>Сегодня</a>
      <a href="products.html" class="nav-item"><span class="nav-ic"></span>Продукты</a>
      <a href="weight.html" class="nav-item active"><span class="nav-ic"></span>Вес</a>
      <a href="menu.html" class="nav-item"><span class="nav-ic"></span>Меню</a>
      <a href="workouts.html" class="nav-item"><span class="nav-ic"></span>Тренировки</a>
    </nav>
  </div>
  <script>
    let weights = [];
    async function load() {
      if (!CalAPI.getToken()) { document.getElementById('list').innerHTML = '<div style="text-align:center;padding:40px;">Войди на главной</div>'; return; }
      weights = await CalAPI.weights.list() || [];
      render();
    }
    function render() {
      const el = document.getElementById('list');
      if (!weights.length) { el.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Пока нет записей</div>'; return; }
      el.innerHTML = weights.slice().reverse().map(w => `<div class="food-item" style="margin-bottom:8px;">
        <div style="flex:1;"><div style="font-weight:600;">${w.weight} кг</div><div style="font-size:12px;color:#888;">${w.date}</div></div>
      </div>`).join('');
    }
    async function addWeight() {
      const w = prompt('Вес (кг):');
      if (!w) return;
      weights.push({ date: new Date().toISOString().slice(0,10), weight: +w });
      await CalAPI.weights.save(weights);
      render();
    }
    load();
  </script>
</body>
</html>
