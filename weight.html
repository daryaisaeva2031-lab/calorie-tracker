<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вес — Калории</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .weight-big {
      background: var(--sage-light); border-radius: 16px; padding: 16px;
      text-align: center; margin: 12px 0;
    }
    .weight-big .num { font-size: 36px; font-weight: 700; color: var(--sage-dark); }
    .weight-stats { display: flex; justify-content: space-between; margin: 12px 0; }
    .stat-box {
      background: var(--white); border-radius: 12px; padding: 10px 14px; text-align: center;
      box-shadow: var(--shadow); flex: 1; margin: 0 4px;
    }
    .stat-label { font-size: 12px; color: var(--text-light); }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--sage-dark); }
    .graph-container {
      background: var(--white); border-radius: 16px; padding: 12px; margin: 12px 0;
      height: 180px; position: relative;
    }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--sage-light);
    }
    .add-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; justify-content: center; align-items: center;
    }
    .add-modal.show { display: flex; }
    .add-box {
      background: var(--cream); border-radius: 20px; padding: 24px; width: 80%; max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Вес</h1>
      <button class="icon-btn" onclick="openAdd()">+</button>
    </header>

    <div class="weight-big">
      <div class="num" id="currentWeight">77,4 кг</div>
      <div style="font-size:13px; color:var(--text-light); margin-top:4px;">Текущий вес</div>
    </div>

    <div class="weight-stats">
      <div class="stat-box">
        <div class="stat-label">Начальный</div>
        <div class="stat-value" id="startWeight">81,0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Желанный</div>
        <div class="stat-value" id="targetWeight">65,0</div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; font-size:13px; margin:8px 4px; color:var(--text-light);">
      <span>Сброшено: <b id="lost">3,6 кг</b></span>
      <span>Осталось: <b id="left">12,4 кг</b></span>
    </div>

    <div class="graph-container">
      <canvas id="weightChart" width="340" height="160"></canvas>
    </div>

    <div class="card">
      <div style="font-weight:700; margin-bottom:8px; color:var(--sage-dark);">История</div>
      <div id="historyList"></div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">🏠<span>Сегодня</span></a>
      <a href="products.html" class="nav-item">🥦<span>Продукты</span></a>
      <a href="weight.html" class="nav-item active">⚖️<span>Вес</span></a>
      <a href="menu.html" class="nav-item">📋<span>Меню</span></a>
      <a href="workouts.html" class="nav-item">💪<span>Тренировки</span></a>
    </nav>
  </div>

  <div class="add-modal" id="addModal" onclick="if(event.target===this) closeAdd()">
    <div class="add-box">
      <div style="font-weight:700; margin-bottom:16px; text-align:center;">Добавить вес</div>
      <input type="number" step="0.1" id="newWeight" placeholder="77.4" style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--sage-light); font-size:18px; text-align:center; margin-bottom:12px;">
      <button onclick="addWeight()" style="width:100%; padding:12px; border:none; border-radius:12px; background:var(--sage); color:white; font-family:inherit; font-size:15px; font-weight:600;">Добавить</button>
    </div>
  </div>

  <script>
    let weights = JSON.parse(localStorage.getItem('weights')) || [
      {date: '2026-09-01', value: 81.0},
      {date: '2026-10-01', value: 77.1},
      {date: '2026-10-03', value: 77.0},
      {date: '2026-10-09', value: 77.4}
    ];
    const target = 65;
    const start = 81;

    function openAdd() { document.getElementById('addModal').classList.add('show'); }
    function closeAdd() { document.getElementById('addModal').classList.remove('show'); }

    function addWeight() {
      const val = parseFloat(document.getElementById('newWeight').value);
      if (!val) return;
      const today = new Date().toISOString().slice(0,10);
      weights.push({date: today, value: val});
      weights.sort((a,b) => a.date.localeCompare(b.date));
      localStorage.setItem('weights', JSON.stringify(weights));
      closeAdd();
      render();
    }

    function render() {
      const current = weights[weights.length-1]?.value || 77.4;
      document.getElementById('currentWeight').textContent = current.toFixed(1).replace('.', ',') + ' кг';
      document.getElementById('lost').textContent = (start - current).toFixed(1).replace('.', ',') + ' кг';
      document.getElementById('left').textContent = (current - target).toFixed(1).replace('.', ',') + ' кг';

      // History
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      [...weights].reverse().forEach((w, i, arr) => {
        const prev = arr[i+1];
        const diff = prev ? w.value - prev.value : 0;
        const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '';
        const color = diff > 0 ? '#c44' : diff < 0 ? 'var(--sage)' : 'var(--text-light)';
        list.innerHTML += `<div class="history-item">
          <span>${w.date.slice(8)}.${w.date.slice(5,7)}</span>
          <span>${w.value.toFixed(1).replace('.', ',')} кг <span style="color:${color}">${arrow}</span></span>
        </div>`;
      });

      drawChart();
    }

    function drawChart() {
      const canvas = document.getElementById('weightChart');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);

      if (weights.length < 2) return;

      const vals = weights.map(x => x.value);
      const min = Math.min(...vals, target) - 1;
      const max = Math.max(...vals, start) + 1;

      const toX = i => (i / (weights.length - 1)) * (w - 40) + 20;
      const toY = v => h - 20 - ((v - min) / (max - min)) * (h - 40);

      // Target line
      ctx.strokeStyle = '#a8c4a5';
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(20, toY(target));
      ctx.lineTo(w-20, toY(target));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#7d9b7a';
      ctx.font = '12px Nunito';
      ctx.fillText(target, w-35, toY(target)-4);

      // Weight line
      ctx.strokeStyle = '#4e6b4c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      weights.forEach((p, i) => {
        const x = toX(i), y = toY(p.value);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Dots
      weights.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(toX(i), toY(p.value), 4, 0, Math.PI*2);
        ctx.fillStyle = '#4e6b4c';
        ctx.fill();
      });
    }

    render();
  </script>
</body>
</html>
