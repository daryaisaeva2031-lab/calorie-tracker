<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="sync-shim.js?v=20261118-session"></script>
  <script type="module" src="sync.js?v=20261118-del2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покупки — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-session">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Калории">
  <meta name="theme-color" content="#6F7B52">
  <script src="app-update.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Список покупок</h1>
      <button class="icon-btn" type="button" onclick="addItem()" aria-label="Добавить">+</button>
    </header>

    <div id="list"></div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 12 5l7.5 6.5"/><path d="M6.5 10.5V19h11v-8.5"/></svg></span>Сегодня</a>
      <a href="products.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c6-1 11-5 13.5-13.5C10 5 5 10 5 19Z"/><path d="M8.5 14.5c2 0 5-2.5 6.5-6"/></svg></span>Продукты</a>
      <a href="weight.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="5.5" width="15" height="14.2" rx="3"/><rect x="8" y="8" width="8" height="2.3" rx=".7"/><circle cx="12" cy="14.4" r="2.5"/><path d="M12 14.4 13.3 12.8"/></svg></span>Вес</a>
      <a href="menu.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5h9.5A2.5 2.5 0 0 1 20 7v12.5H8A2.5 2.5 0 0 1 5.5 17V7A2.5 2.5 0 0 1 8 4.5Z"/><path d="M9.5 9.5h7M9.5 13h7M9.5 16.5h4.5"/></svg></span>Меню</a>
      <a href="workouts.html" class="nav-item"><span class="nav-ic"><svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 9.2v5.6M17.8 9.2v5.6"/><path d="M8.2 7.6v8.8M15.8 7.6v8.8"/><path d="M8.2 12h7.6"/><path d="M4.8 10.2h1.4v3.6H4.8zM17.8 10.2h1.4v3.6H17.8z"/></svg></span>Тренировки</a>
    </nav>
  </div>
  <script>
    // Shopping list lives in localStorage 'shopping' ([{id, name, qty, group, done}]);
    // sync.js mirrors it to the worker (/api/shopping).
    function loadItems() {
      try { const v = JSON.parse(localStorage.getItem('shopping') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
    }
    function saveItems(items) { localStorage.setItem('shopping', JSON.stringify(items)); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }
    function render() {
      const items = loadItems();
      const groups = {};
      items.forEach(i => { const g = i.group || 'Другое'; (groups[g] = groups[g] || []).push(i); });
      let html = '';
      Object.keys(groups).forEach(g => {
        const list = groups[g];
        html += '<div class="card"><div style="font-weight:600; margin-bottom:10px;">' + esc(g) + '</div>';
        list.forEach((i, idx) => {
          const mb = idx < list.length - 1 ? ' style="margin-bottom:8px;"' : '';
          const box = i.done
            ? '<div class="checkbox" style="background:var(--olive);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;line-height:1;">✓</div>'
            : '<div class="checkbox"></div>';
          html += '<div class="list-item"' + mb + '>' +
            '<div onclick="toggle(' + JSON.stringify(i.id) + ')" style="cursor:pointer;">' + box + '</div>' +
            '<div onclick="toggle(' + JSON.stringify(i.id) + ')" style="flex:1;cursor:pointer;' + (i.done ? 'text-decoration:line-through;opacity:.6;' : '') + '">' + esc(i.name) + '</div>' +
            '<div style="color:var(--text-light);">' + esc(i.qty || '') + '</div>' +
            '<button type="button" onclick="del(' + JSON.stringify(i.id) + ')" aria-label="Удалить" style="border:none;background:none;color:var(--text-light);font-size:20px;cursor:pointer;padding:0 0 0 6px;">×</button>' +
          '</div>';
        });
        html += '</div>';
      });
      document.getElementById('list').innerHTML = html ||
        '<div class="card" style="text-align:center;color:var(--text-light);">Список пуст. Нажмите «+», чтобы добавить.</div>';
    }
    function addItem() {
      const name = prompt('Название:');
      if (!name) return;
      const qty = prompt('Количество:') || '';
      const group = prompt('Группа (молочка, овощи, другое):') || 'Другое';
      const items = loadItems();
      items.push({ id: Date.now(), name: name, qty: qty, group: group, done: false });
      saveItems(items);
      render();
    }
    function toggle(id) {
      const items = loadItems();
      const i = items.find(x => x.id === id);
      if (i) i.done = !i.done;
      saveItems(items);
      render();
    }
    function del(id) {
      saveItems(loadItems().filter(x => x.id !== id));
      render();
    }
    window.__calorieOnSync = function (keys) {
      if (keys.length === 1 && keys[0] === 'shopping') { render(); return true; }
      return false;
    };
    render();
  </script>
</body>
</html>
