<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покупки — Калории</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h1>Список покупок</h1>
      <button class="icon-btn">+</button>
    </header>

    <div class="card">
      <div style="font-weight:600; margin-bottom:10px;">Сегодня</div>
      <div class="list-item" style="margin-bottom:8px;"><div class="checkbox"></div><div style="flex:1;">Молоко</div><div style="color:var(--text-light);">1 л</div></div>
      <div class="list-item" style="margin-bottom:8px;"><div class="checkbox"></div><div style="flex:1;">Яйца</div><div style="color:var(--text-light);">10 шт</div></div>
      <div class="list-item"><div class="checkbox"></div><div style="flex:1;">Хлеб</div><div style="color:var(--text-light);">1 шт</div></div>
    </div>

    <div class="card">
      <div style="font-weight:600; margin-bottom:10px;">Овощи</div>
      <div class="list-item" style="margin-bottom:8px;"><div class="checkbox"></div><div style="flex:1;">Огурцы</div><div style="color:var(--text-light);">3 шт</div></div>
      <div class="list-item"><div class="checkbox"></div><div style="flex:1;">Помидоры</div><div style="color:var(--text-light);">4 шт</div></div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">🏠<span>Сегодня</span></a>
      <a href="menu.html" class="nav-item">📋<span>Меню</span></a>
      <a href="products.html" class="nav-item">🥦<span>Продукты</span></a>
      <a href="shopping.html" class="nav-item active">🛒<span>Покупки</span></a>
      <a href="weight.html" class="nav-item">⚖️<span>Вес</span></a>
    </nav>
  </div>
</body>
</html>
