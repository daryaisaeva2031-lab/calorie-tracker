<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Посуда — Калории</title>
  <link rel="stylesheet" href="style.css?v=20261118-api">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="api-client.js?v=20261118-api"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="products.html"><button class="icon-btn">←</button></a>
      <h1>Посуда</h1>
      <button class="icon-btn" onclick="add()">+</button>
    </header>
    <div id="list" style="padding:12px;"></div>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><span class="nav-ic"></span>Сегодня</a>
      <a href="products.html" class="nav-item active"><span class="nav-ic"></span>Продукты</a>
      <a href="weight.html" class="nav-item"><span class="nav-ic"></span>Вес</a>
      <a href="menu.html" class="nav-item"><span class="nav-ic"></span>Меню</a>
      <a href="workouts.html" class="nav-item"><span class="nav-ic"></span>Тренировки</a>
    </nav>
  </div>
  <script>
    let dishes = [];
    async function load() {
      if (!CalAPI.getToken()) { document.getElementById('list').innerHTML = '<div style="text-align:center;padding:40px;">Войди на главной</div>'; return; }
      dishes = await CalAPI.dishes.list() || [];
      render();
    }
    function render() {
      const el = document.getElementById('list');
      if (!dishes.length) { el.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Пока нет посуды</div>'; return; }
      el.innerHTML = dishes.map(d => `<div class="food-item" style="margin-bottom:8px;"><div style="flex:1;"><div style="font-weight:600;">${d.emoji||'🍽️'} ${d.name}</div><div style="font-size:12px;color:#888;">${d.weight} г</div></div></div>`).join('');
    }
    async function add() {
      const name = prompt('Название:');
      if (!name) return;
      const weight = +prompt('Вес (г):');
      if (!weight) return;
      dishes.push({ id: Date.now(), name, weight, emoji: '🍽️' });
      await CalAPI.dishes.save(dishes);
      render();
    }
    load();
  </script>
</body>
</html>
